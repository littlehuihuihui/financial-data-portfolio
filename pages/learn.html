              "title": "ROW_NUMBER",
              "level": "??",
              "content": "### 课前\n\n- **场景**：要「每用户支付金额最高的 1 笔订单」做召回；用 RANK 时并列会取出多行。  \n- **目标**：掌握 `ROW_NUMBER` 的分区、排序、外层过滤；对比 RANK。  \n- **先修**：SELECT / JOIN 爆炸 → **下一课**：RANK 或 LAG/LEAD\n\n### 样例输入（orders 中 user_id=1 的 paid）\n\n| order_id | user_id | amount | created_at |\n|---:|---:|---:|---|\n| 101 | 1 | 80.00 | 2024-01-01 10:00:00 |\n| 102 | 1 | 120.00 | 2024-01-02 11:00:00 |\n| 103 | 1 | 120.00 | 2024-01-03 09:00:00 |\n| 108 | 1 | 30.00 | 2024-01-07 09:30:00 |\n\n102 与 103 金额并列；要用**稳定决胜列**决定谁当 rn=1。\n\n### 是什么\n\n- **一句话定义**：在分区内按排序为每一行生成**唯一连续**序号（1,2,3…）。  \n- **骨架**：`ROW_NUMBER() OVER (PARTITION BY … ORDER BY …)`  \n- **对比**：`RANK` 并列同名次且跳号；Top-N「只要 N 行」优先 `ROW_NUMBER`。\n\n### 怎么写\n\n```sql\n-- 每用户支付金额 Top1（并列时取更早下单）\nSELECT order_id, user_id, amount, created_at, rn\nFROM (\n  SELECT\n    o.*,\n    ROW_NUMBER() OVER (\n      PARTITION BY user_id\n      ORDER BY amount DESC, created_at ASC, order_id ASC   -- 稳定决胜\n    ) AS rn\n  FROM orders o\n  WHERE status = 'paid'\n) t\nWHERE rn = 1\nORDER BY user_id;\n```\n\n**事件去重（order_events）**：同一逻辑，`PARTITION BY order_id, event_type` 或按 `event_id`，`ORDER BY event_time DESC`。\n\n### 查询结果（节选）\n\n| order_id | user_id | amount | rn | 说明 |\n|---:|---:|---:|---:|---|\n| 102 | 1 | 120.00 | 1 | 与 103 并列，因 created_at 更早胜出 |\n| 105 | 2 | 90.00 | 1 | 用户 2 唯一 paid 有金额 |\n| 106 | 3 | NULL | 1 | 该用户仅一笔 paid（金额缺失） |\n\n### 用在哪\n\n1. **Top-N 召回**：每用户/每类目取前 N。  \n2. **明细去重**：保留最新事件一行。  \n3. **为何不用 RANK**：`WHERE rnk<=1` 在并列时可能 >1 行。\n\n### 易错对照\n\n| 错写法 | 现象 | 正写法 |\n|---|---|---|\n| `WHERE ROW_NUMBER() OVER(...) = 1` | 语法错 | 子查询/CTE 外包一层再滤 |\n| `ORDER BY` 只有 amount | 并列不稳定 | 加 `created_at, order_id` |\n| 用 RANK 做严格 Top1 | 并列多行 | `ROW_NUMBER` |\n\n### 动手\n\n给出每用户 **Top2** 支付订单（`rn <= 2`）。思考：user_id=1 应包含 102 与 103。",
              "children": []
            },
            {
              "id": "sql-rank",
              "title": "RANK",
              "level": "??",
              "content": "### 课前\n\n- **场景**：支付金额排行要「并列同名次」，并列后跳号（1,2,2,4）。  \n- **目标**：掌握 `RANK`；对比 `ROW_NUMBER` / `DENSE_RANK`。  \n- **先修**：ROW_NUMBER（金课）→ **下一课**：DENSE_RANK\n\n### 样例输入（全局 paid 按金额）\n\n| order_id | amount |\n|---:|---:|\n| 102 | 120.00 |\n| 103 | 120.00 |\n| 105 | 90.00 |\n| 101 | 80.00 |\n| 108 | 30.00 |\n| 106 | NULL |\n\n### 是什么\n\n- **一句话定义**：排序名次；**并列同名次，之后跳号**。  \n- **对比**：`ROW_NUMBER` 强制唯一序号；`DENSE_RANK` 并列不跳号。  \n- **骨架**：`RANK() OVER (ORDER BY …)`，可加 `PARTITION BY`。\n\n### 怎么写\n\n```sql\nSELECT\n  order_id,\n  amount,\n  RANK() OVER (ORDER BY amount DESC) AS rnk,\n  DENSE_RANK() OVER (ORDER BY amount DESC) AS drnk,\n  ROW_NUMBER() OVER (ORDER BY amount DESC, order_id ASC) AS rn\nFROM orders\nWHERE status = 'paid'\n  AND amount IS NOT NULL\nORDER BY amount DESC, order_id;\n```\n\n### 查询结果（节选）\n\n| order_id | amount | rnk | drnk | rn |\n|---:|---:|---:|---:|---:|\n| 102 | 120.00 | 1 | 1 | 1 |\n| 103 | 120.00 | 1 | 1 | 2 |\n| 105 | 90.00 | 3 | 2 | 3 |\n\n注意：`RANK` 在两个第 1 后，下一个是 **3**。\n\n### 用在哪\n\n1. **竞赛排名**：并列并列，名次跳号。  \n2. **分位粗分**：按 rank 切桶。  \n3. **与 ROW_NUMBER**：要固定 N 行用 RN；要名次语义用 RANK。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 用 RANK 取 Top1 每组 | 并列多行 | 要唯一用 ROW_NUMBER |\n| ORDER BY 无决胜列 | 仅影响 RN 稳定性 | 名次并列是特性 |\n| NULL 参与排序 | 引擎相关 | 先过滤或 COALESCE |\n\n### 动手\n\n按 `user_id` 分区写 `RANK() OVER (PARTITION BY user_id ORDER BY amount DESC)`，看 Ada 的 102/103。",
              "children": [],
              "lessonParent": true
            },
            {
              "id": "sql-dense-rank",
              "title": "DENSE_RANK",
              "level": "??",
              "content": "### 课前\n\n- **场景**：只要「金额档次」连续编号（1,2,2,3），不要跳号。  \n- **目标**：掌握 `DENSE_RANK`；能向业务解释与 RANK 的差异。  \n- **先修**：RANK → **下一课**：LAG/LEAD\n\n### 样例输入\n\n同 RANK 课：120,120,90,80,30。\n\n### 是什么\n\n- **一句话定义**：并列同名次，**之后不跳号**。  \n- **记忆**：dense = 名次稠密。  \n- **用法**：档位、级别编码。\n\n### 怎么写\n\n```sql\nSELECT\n  order_id,\n  amount,\n  DENSE_RANK() OVER (ORDER BY amount DESC) AS drnk\nFROM orders\nWHERE status = 'paid' AND amount IS NOT NULL\nORDER BY drnk, order_id;\n```\n\n### 查询结果（节选）\n\n| order_id | amount | drnk |\n|---:|---:|---:|\n| 102 | 120 | 1 |\n| 103 | 120 | 1 |\n| 105 | 90 | 2 |\n| 101 | 80 | 3 |\n\n### 用在哪\n\n1. **连续等级**：钻石/金/银编码。  \n2. **去重档位数**：有多少种不同金额档。  \n3. **可视化轴**：不希望轴上出现空洞名次。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 业务要跳号却用 DENSE | 与竞赛规则不符 | 改 RANK |\n| 与 ROW_NUMBER 混淆 | 并列被拆开 | 看要不要唯一行 |\n\n### 动手\n\n`SELECT COUNT(DISTINCT DENSE_RANK …)` 不合法时，改用子查询：有多少个不同 `drnk`。",

            {
              "id": "sql-lag-lead",
              "title": "LAG/LEAD",
              "level": "??",
              "content": "### 课前\n\n- **场景**：算同一用户「本单金额 − 上一单金额」的变化。  \n- **目标**：会用 `LAG`/`LEAD`；写清分区与排序。  \n- **先修**：DENSE_RANK → **下一课**：SUM OVER\n\n### 样例输入（user_id=1）\n\n101:80 → 102:120 → 103:120 → 108:30。\n\n### 是什么\n\n- **一句话定义**：取分区内向前/向后第 n 行的列值（默认 n=1）。  \n- **直觉**：当前行看一眼上一条/下一条。  \n- **替代**：比 SELF JOIN 找「上一笔」更干净。\n\n### 怎么写\n\n```sql\nSELECT\n  order_id,\n  user_id,\n  amount,\n  created_at,\n  LAG(amount, 1) OVER (\n    PARTITION BY user_id ORDER BY created_at, order_id\n  ) AS prev_amount,\n  amount - LAG(amount, 1) OVER (\n    PARTITION BY user_id ORDER BY created_at, order_id\n  ) AS delta_amt,\n  LEAD(order_id, 1) OVER (\n    PARTITION BY user_id ORDER BY created_at, order_id\n  ) AS next_order_id\nFROM orders\nWHERE status = 'paid' AND user_id = 1\nORDER BY created_at;\n```\n\n### 查询结果\n\n| order_id | amount | prev_amount | delta_amt |\n|---:|---:|---:|---:|\n| 101 | 80.00 | NULL | NULL |\n| 102 | 120.00 | 80.00 | 40.00 |\n| 103 | 120.00 | 120.00 | 0.00 |\n| 108 | 30.00 | 120.00 | -90.00 |\n\n### 用在哪\n\n1. **环比/会话**：上一次活跃、上一单。  \n2. **埋点路径**：下一跳页面。  \n3. **变更检测**：状态是否变化。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 漏 PARTITION | 跨用户取到别人的上一单 | 必写用户/实体键 |\n| 排序不稳定 | delta 抖动 | 加决胜列 order_id |\n| 首行当 0 | 掩盖「无上期」 | 保留 NULL 或显式 COALESCE 并注释 |\n\n### 动手\n\n对所有 paid 用户算 `delta_amt`，筛出 `|delta| >= 50` 的行。",
              "children": []
            },
            {
              "id": "sql-sum-over",
              "title": "SUM OVER",
              "level": "??",
              "content": "### 课前\n\n- **场景**：要每笔订单旁展示「该用户截至本单的累计 GMV」，且保留明细行。  \n- **目标**：会写 `SUM() OVER (PARTITION … ORDER BY …)` 累计。  \n- **先修**：LAG/LEAD → **下一课**：窗口帧 ROWS\n\n### 样例输入（user_id=1 金额）\n\n80 → 120 → 120 → 30；累计 80,200,320,350。\n\n### 是什么\n\n- **一句话定义**：窗口版聚合——**不合并行**，为每行挂上聚合结果。  \n- **对比**：`GROUP BY` 会少行；`SUM OVER` 保明细。  \n- **默认帧**：带 `ORDER BY` 时多数引擎为「从分区开头到当前行」（详帧课）。\n\n### 怎么写\n\n```sql\nSELECT\n  order_id,\n  user_id,\n  COALESCE(amount, 0) AS amt,\n  SUM(COALESCE(amount, 0)) OVER (\n    PARTITION BY user_id\n    ORDER BY created_at, order_id\n  ) AS running_gmv,\n  SUM(COALESCE(amount, 0)) OVER (\n    PARTITION BY user_id\n  ) AS user_total_gmv\nFROM orders\nWHERE status = 'paid'\nORDER BY user_id, created_at;\n```\n\n### 查询结果（user_id=1）\n\n| order_id | amt | running_gmv | user_total_gmv |\n|---:|---:|---:|---:|\n| 101 | 80 | 80 | 350 |\n| 102 | 120 | 200 | 350 |\n| 103 | 120 | 320 | 350 |\n| 108 | 30 | 350 | 350 |\n\n### 用在哪\n\n1. **累计收入**：用户/门店 running total。  \n2. **占比**：`amt / SUM OVER (PARTITION …)`。  \n3. **明细+汇总**：一行看全局。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 与 GROUP BY 混用不当 | 报错/粒度乱 | 窗口与分组分层 |\n| 忘记 COALESCE | NULL 传染 | 累计前处理空值 |\n| 不理解帧 | 累计变整组相同 | 看下一课 ROWS |\n\n### 动手\n\n算每笔订单金额占该用户总 GMV 的比例 `pct`。",
              "children": []

            {
              "id": "sql-cte-pipeline",
              "title": "CTE流水线",
              "level": "??",
              "content": "### 课前\n\n- **场景**：先筛支付单，再按用户汇总，再只留 GMV≥100 的用户——希望一步步可读。  \n- **目标**：用多层 CTE 搭流水线；知道 CTE 多为逻辑层（非一定物化）。  \n- **先修**：窗口帧 → **下一课**：标量子查询\n\n### 样例输入\n\n统一库 paid 订单；最终应含 user_id=1（350），可能含 2（90）取决于阈值。\n\n### 是什么\n\n- **一句话定义**：`WITH` 命名中间结果，供后续步骤引用。  \n- **直觉**：把子查询拉平、起名字。  \n- **价值**：复杂报表可读、可测；递归 CTE 另课。\n\n### 怎么写\n\n```sql\nWITH paid AS (\n  SELECT order_id, user_id, COALESCE(amount, 0) AS amt, created_at\n  FROM orders\n  WHERE status = 'paid'\n),\nper_user AS (\n  SELECT\n    user_id,\n    COUNT(*) AS order_cnt,\n    SUM(amt) AS gmv\n  FROM paid\n  GROUP BY user_id\n),\nqualified AS (\n  SELECT * FROM per_user WHERE gmv >= 100\n)\nSELECT\n  q.user_id,\n  u.user_name,\n  q.order_cnt,\n  q.gmv\nFROM qualified q\nJOIN users u ON u.user_id = q.user_id\nORDER BY q.gmv DESC;\n```\n\n### 查询结果（阈值 100）\n\n| user_id | user_name | order_cnt | gmv |\n|---:|---|---:|---:|\n| 1 | Ada | 4 | 350.00 |\n\n（若阈值改为 80，则 Bob 的 90 也会进入。）\n\n### 用在哪\n\n1. **复杂报表**：多段转换。  \n2. **同一中间结果复用**：避免复制子查询。  \n3. **教学拆解**：每层可单独 SELECT 调试。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 以为 CTE 一定物化 | 性能预期错 | 看引擎；必要时落临时表 |\n| 一层写完巨型 SELECT | 难维护 | 拆 3～5 个命名步骤 |\n| CTE 里引用未定义名 | 报错 | 注意定义顺序 |\n\n### 动手\n\n在流水线末加一层：给 qualified 用户打 `tier`（CASE），输出 H/M/L。",

              "id": "sql-explain",
              "title": "EXPLAIN",
              "level": "??",
              "content": "### 课前\n\n- **场景**：同样查 paid 订单，想知道有没有走全表扫描、预估多少行。  \n- **目标**：会跑 `EXPLAIN`；认识 type/rows/key 等基本字段（MySQL 视角）。  \n- **先修**：INDEX 入门 → **下一课**：复合索引\n\n### 样例输入\n\n```sql\nCREATE INDEX IF NOT EXISTS idx_orders_status_created\n  ON orders (status, created_at);  -- 若上节已建可跳过\n```\n\n（DuckDB/PG 用 `EXPLAIN` / `EXPLAIN ANALYZE`，列名不同，思想相同。）\n\n### 是什么\n\n- **一句话定义**：让优化器打印「打算怎么执行」的计划。  \n- **层次**：`EXPLAIN` 估计划；`EXPLAIN ANALYZE`（PG）带真实执行统计。  \n- **用途**：验证索引、发现坏 JOIN 顺序、发现临时表/文件排序。\n\n### 怎么写\n\n```sql\nEXPLAIN\nSELECT order_id, user_id, amount\nFROM orders\nWHERE status = 'paid'\nORDER BY created_at DESC\nLIMIT 5;\n\nEXPLAIN\nSELECT u.user_name, o.order_id\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.user_id\nWHERE u.city = '上海';\n```\n\n### 查询结果\n\n本课结果是**计划表**而非业务表。阅读清单：\n\n| 关注点 | 问什么 |\n|---|---|\n| type / access | 全表？索引？ |\n| key | 用了哪棵索引 |\n| rows | 估计扫描行数 |\n| Extra | Using filesort / temporary？ |\n\n小样例库 rows 都很小——把习惯练会，换大表才有对比。\n\n### 用在哪\n\n1. **慢 SQL 首诊**。  \n2. **上线前**：确认新索引被用到。  \n3. **教学**：对照改写前后计划。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 只看 EXPLAIN 不看 ANALYZE | 估计不准 | 关键环境用分析版 |\n| 小表结论外推 | 误判 | 用近似生产数据量 |\n| 看不懂就加一堆索引 | 写变慢 | 对准 WHERE/JOIN 列 |\n\n### 动手\n\n对「JOIN order_items 后 SUM(amount)」爆炸写法与「先聚合再 JOIN」各 `EXPLAIN` 一次，对比 rows。",

              "title": "复合索引",
              "level": "??",
              "content": "### 课前\n\n- **场景**：常查 `status=? AND created_at>=?`，单列索引不够好。  \n- **目标**：理解最左前缀；会设计 `(status, created_at)` 这类组合索引。  \n- **先修**：EXPLAIN / INDEX 入门 → **下一课**：中级练习场\n\n### 样例输入\n\n查询形态：\n\n```sql\nSELECT * FROM orders\nWHERE status = 'paid'\n  AND created_at >= '2024-01-02'\nORDER BY created_at;\n```\n\n### 是什么\n\n- **一句话定义**：多列按顺序组成的一棵 BTree 索引。  \n- **最左前缀**：`(a,b,c)` 可支持 `a`、`a+b`、`a+b+c`；一般不能跳过 `a` 只用 `b`。  \n- **顺序**：等值列在前，范围列在后（常见经验）。\n\n### 怎么写\n\n```sql\n-- 推荐：等值 status + 范围/排序 created_at\nCREATE INDEX idx_orders_status_created\n  ON orders (status, created_at);\n\n-- 能较好对齐的写法\nSELECT order_id, amount, created_at\nFROM orders\nWHERE status = 'paid'\n  AND created_at >= '2024-01-02'\nORDER BY created_at;\n\n-- 最左前缀反例（常难用到组合索引后列）\n-- WHERE created_at >= '2024-01-02'  -- 没有 status 等值\n```\n\n### 查询结果\n\n业务结果：102,103,105,106,108 等（paid 且时间达标）。  \n索引课重点：用 `EXPLAIN` 看 `key=idx_orders_status_created`。\n\n### 用在哪\n\n1. **列表接口**：状态 + 时间。  \n2. **覆盖索引**：把 SELECT 列也纳入索引（进阶）。  \n3. **JOIN**：`(user_id, status)` 等。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 范围列放最前 | 后续列区分度用不上 | 等值在前 |\n| 建 (created_at, status) 却总先滤 status | 利用差 | 按 WHERE 顺序设计 |\n| 重复单列+组合 | 冗余 | 能合并则合并 |\n\n### 动手\n\n设计：常查 `WHERE user_id=? AND status=?`，索引列顺序怎么排？写下来并用 EXPLAIN 验证。",

              "id": "sql-begin-commit",
              "title": "BEGIN/COMMIT",
              "level": "??",
              "content": "### 课前\n\n- **场景**：扣减逻辑要「读金额 → 更新状态」同成同败，避免只做了一半。  \n- **目标**：会用事务边界 `START TRANSACTION` / `COMMIT` / `ROLLBACK`。  \n- **先修**：隔离级别金课可并行 → **下一课**：脏读幻读\n\n### 样例输入\n\n把订单 104（created）改为 paid，并写一条 `order_events`——必须同事务。\n\n### 是什么\n\n- **一句话定义**：把多句 SQL 绑成原子单元：全成或全撤。  \n- **ACID 直觉**：原子性靠事务边界；隔离靠隔离级别。  \n- **自动提交**：许多客户端默认 autocommit=1，需显式开事务。\n\n### 怎么写\n\n```sql\nSTART TRANSACTION;\n  UPDATE orders\n  SET status = 'paid'\n  WHERE order_id = 104 AND status = 'created';\n\n  INSERT INTO order_events (event_id, order_id, event_type, event_time)\n  VALUES (8, 104, 'paid', '2024-01-01 12:05:00');\nCOMMIT;\n-- 中途失败则 ROLLBACK;\n\n-- 验证\nSELECT status FROM orders WHERE order_id = 104;\nSELECT * FROM order_events WHERE order_id = 104;\n```\n\n### 查询结果\n\n成功后：104 为 paid；事件表多一行 paid。若故意让 INSERT 主键冲突并 ROLLBACK，则 UPDATE 也应撤回。\n\n### 用在哪\n\n1. 下单/支付多表写  \n2. 转账、库存  \n3. 批量作业「全有或全无」段\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 多写无事务 | 中间态可见 | 显式 BEGIN |\n| 长事务不提交 | 锁等待、版本堆积 | 缩小事务 |\n| DDL 隐式提交 | 边界意外 | 查引擎文档 |\n\n### 动手\n\n开事务更新 104 后**不提交**，另开会话看是否可见（依赖隔离级别）；再 ROLLBACK。",

            {
              "id": "sql-tune-checklist",
              "title": "调优检查清单",
              "level": "??",
              "content": "### 课前\n\n- **场景**：一条报表 SQL 变慢，不知从何下手。  \n- **目标**：记住可执行的检查顺序；对照统一库练手感。  \n- **先修**：EXPLAIN / 索引课 → **下一课**：谓词下推·改写\n\n### 样例输入\n\n任意慢查询；示例用「paid 列表 + JOIN items」。\n\n### 是什么\n\n- **一句话定义**：调优是假设→验证→改写的闭环，不是堆索引。  \n- **清单思维**：先正确，再测量，再改计划。\n\n### 怎么写\n\n```text\n1. 复现：固定参数、记录耗时与行数\n2. EXPLAIN / ANALYZE：看访问类型、rows、临时表/排序\n3. 谓词：能否改成可索引范围？选择性如何？\n4. JOIN：谁驱动？一对多是否爆炸？先聚合？\n5. 选择性索引 / 覆盖索引 / 统计信息\n6. 业务：是否可缓存、预聚合、异步\n7. 回归：改写前后结果集对比（校验 SQL）\n```\n\n```sql\n-- 最小对照\nEXPLAIN SELECT … 爆炸写法;\nEXPLAIN SELECT … 先聚合再 JOIN;\n```\n\n### 查询结果\n\n产出一页「诊断卡」：瓶颈一步、改写一句、验证一行数。\n\n### 用在哪\n\n1. 值班慢查询  \n2. Code Review  \n3. 上线前性能门禁\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 上来加三四个索引 | 写慢、仍不对症 | 先 EXPLAIN |\n| 不校验结果 | 调快但算错 | 结果对比 |\n\n### 动手\n\n对 JOIN 爆炸金课 A/B 两写法填完整诊断卡。",

              "content": "### 课前\n\n- **场景**：要按用户汇总支付 GMV，并与用户维表合并展示。\n- **目标**：掌握 groupby 聚合、`agg` 多指标、`as_index=False` 习惯。\n- **先修**：缺失与类型 → 下一课：merge\n\n### 样例输入\n\n与教程宪法同源四表（`users` / `orders` / `order_items` / `order_events`）。\n本课默认已在 notebook 中执行过宪法构造代码。\n\n### 是什么\n\n- **一句话定义**：按键分组后做汇总（等价 SQL GROUP BY）。\n- **核心**：分组键、聚合函数、多列 `agg`、排序。\n- **直觉**：先压缩成「每组一行」，再谈排名与分层。\n- **边界**：明细字段不要进 GROUP BY；一对多先聚合再 join。\n\n### 怎么写\n\n```python\ngmv = (\n    orders.query(\"status=='paid'\")\n    .assign(amount=lambda d: d[\"amount\"].fillna(0))\n    .groupby(\"user_id\", as_index=False)\n    .agg(gmv=(\"amount\", \"sum\"), orders=(\"order_id\", \"nunique\"))\n    .sort_values(\"gmv\", ascending=False)\n)\nprint(gmv)\nprint(users.merge(gmv, on=\"user_id\", how=\"left\").fillna({\"gmv\": 0, \"orders\": 0}))\n```\n\n### 运行结果\n\nAda GMV 较高；Dan 无订单则左连接后为 0。\n\n### 用在哪\n\n1. **用户价值分层**  2. **日报聚合**  3. **防 JOIN 爆炸的预聚合**\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 对明细 sum 后再与 items join | GMV 放大 | 先按订单聚合 items |\n| `groupby` 后忘记 reset | 索引难 merge | `as_index=False` |\n| 用 `count` 当 `nunique` | 重复行虚高 | 分清计数语义 |\n\n### 动手\n\n按 `status` 统计订单数与金额合计（空金额当 0）。\n\n### 对照辨析\n\n| 维度 | 「groupby 聚合」常见做法 | 易混替代 |\n|---|---|---|\n| 计算位置 | pandas 内存表 | SQL/DuckDB 下推 |\n| 写法 | 向量化/`assign` | 行循环 `iterrows` |\n| 验收 | 与 SQL 同口径 diff | 只看 head 几行 |\n\n### 最小实验\n\n1. 用宪法四表跑通主路径代码\n2. 改一个过滤条件，预测 shape 再验证\n3. 把结果和等价 SQL 各算一遍做 diff\n\n### 交付检查单\n\n- [ ] 空值/类型已声明处理策略\n- [ ] 无链式赋值警告\n- [ ] 关键指标可与数仓口径对齐\n- [ ] 代码可在新环境 import 后复现\n\n### 常见追问\n\n- 若数据量再大 10 倍，「groupby 聚合」还应留在 pandas 吗？阈值是什么？\n- 和 SQL 同学对口径时，你用哪 3 个字段做 join key / 过滤条件？\n- 写出一个会让结果静默错误的写法（不是报错那种）。\n",

              "content": "### 课前\n\n- **场景**：用户表要挂上「是否下过单」与 GMV，且不能因为明细行爆炸。\n- **目标**：掌握 how=left/inner、indicator、防爆炸（先聚合再 merge）。\n- **先修**：groupby → 下一课：透视\n\n### 样例输入\n\n与教程宪法同源四表（`users` / `orders` / `order_items` / `order_events`）。\n本课默认已在 notebook 中执行过宪法构造代码。\n\n### 是什么\n\n- **一句话定义**：按键把两张表横着拼起来（SQL JOIN）。\n- **核心**：连接键、how、一对多爆炸、`validate`/`indicator`。\n- **直觉**：维表 left join 事实聚合结果，而不是 left join 明细再 sum。\n- **边界**：多键关联写全；后缀 `_x/_y` 要立刻 rename。\n\n### 怎么写\n\n```python\n# 正确：先聚合订单，再挂用户\nagg = (\n    orders.query(\"status=='paid'\")\n    .assign(amount=lambda d: d[\"amount\"].fillna(0))\n    .groupby(\"user_id\", as_index=False)[\"amount\"].sum()\n    .rename(columns={\"amount\": \"gmv\"})\n)\nu = users.merge(agg, on=\"user_id\", how=\"left\").fillna({\"gmv\": 0})\nprint(u)\n\n# 找从未下单用户\nflag = users.merge(orders[[\"user_id\"]].drop_duplicates(), on=\"user_id\", how=\"left\", indicator=True)\nprint(flag.loc[flag[\"_merge\"] == \"left_only\", [\"user_id\", \"user_name\"]])\n```\n\n### 运行结果\n\n从未下单用户为 Dan；Ada 有 GMV。\n\n### 用在哪\n\n1. **宽表特征**  2. **完整性审计（孤儿行）**  3. **与 SQL JOIN 口径对齐**\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| users⋈order_items 后 sum 金额 | GMV 放大 | 先按 order 聚合 |\n| 默念 inner 丢维表用户 | 名单不全 | 报表常用 left |\n| 键类型一边 int 一边 str | 匹配为空 | 统一类型 |\n\n### 动手\n\n用 merge 统计每个 sku 被多少不同用户买过（经 orders 关联）。\n\n### 对照辨析\n\n| 维度 | 「merge 关联」常见做法 | 易混替代 |\n|---|---|---|\n| 计算位置 | pandas 内存表 | SQL/DuckDB 下推 |\n| 写法 | 向量化/`assign` | 行循环 `iterrows` |\n| 验收 | 与 SQL 同口径 diff | 只看 head 几行 |\n\n### 最小实验\n\n1. 用宪法四表跑通主路径代码\n2. 改一个过滤条件，预测 shape 再验证\n3. 把结果和等价 SQL 各算一遍做 diff\n\n### 交付检查单\n\n- [ ] 空值/类型已声明处理策略\n- [ ] 无链式赋值警告\n- [ ] 关键指标可与数仓口径对齐\n- [ ] 代码可在新环境 import 后复现\n\n### 常见追问\n\n- 若数据量再大 10 倍，「merge 关联」还应留在 pandas 吗？阈值是什么？\n- 和 SQL 同学对口径时，你用哪 3 个字段做 join key / 过滤条件？\n- 写出一个会让结果静默错误的写法（不是报错那种）。\n",

              "content": "### 课前\n\n- **场景**：订单库又要支撑下单，又有人直接扫全表算日报，系统开始抖。\n- **目标**：分清 OLTP 与 OLAP 的负载画像，知道什么该进仓/副本。\n- **先修**：db-constitution → ACID / 引擎\n\n### 样例输入\n\n与 SQL/数据库教程宪法同源四表：`users`、`orders`、`order_items`、`order_events`。\n可在 MySQL 8+ / PostgreSQL / DuckDB 上对照练习。\n\n### 是什么\n\n- **一句话定义**：OLTP 服务短事务点查更新；OLAP 服务大范围扫描聚合分析。\n- **核心差异**：延迟 vs 吞吐、行存 vs 列存、索引点查 vs 批扫。\n- **直觉**：收银台（OLTP）和经分报表（OLAP）不要抢同一条结账通道。\n- **边界**：小型团队可同库分时段；规模上来必须读写分离或进仓。\n\n### 怎么写\n\n```sql\n-- OLTP 画像：按主键/状态点查\nSELECT * FROM orders WHERE order_id = 101;\nUPDATE orders SET status='paid' WHERE order_id=104 AND status='created';\n\n-- OLAP 画像：大范围聚合（应落到副本/仓/列存）\nSELECT DATE(created_at) AS d, SUM(amount) AS gmv\nFROM orders\nWHERE status='paid'\nGROUP BY DATE(created_at);\n```\n\n### 运行结果\n\n点查走主键；日报聚合若在主库长扫，易拖垮 OLTP。\n\n### 用在哪\n\n1. **架构评审**  2. **慢查询归因**  3. **选型（MySQL vs CH）**\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 在主库跑巨大 GROUP BY | 抖动/锁等待 | 进仓或只读副本 |\n| 给 OLAP 表狂建点查索引 | 写入变慢 | 列存/投影 |\n| 用缓存硬扛分析 | 口径不一致 | 明确数仓链路 |\n\n### 动手\n\n列出你们环境里 3 条 SQL，标注各自更像 OLTP 还是 OLAP，并给出放置建议。\n\n### 对照辨析\n\n| 维度 | 「OLTP vs OLAP」 | 易混概念 |\n|---|---|---|\n| 负载 | OLTP vs OLAP 放对地方 | 主库硬扛分析 |\n| 模型 | 约束与类型选对 | 全用 VARCHAR/FLOAT |\n| 运维 | 备份/复制/池化 | 只关注功能正确 |\n\n### 最小实验\n\n1. 在样例库写出最小可运行示例\n2. 做一次故意失败并记录报错\n3. 用一句话向非 DBA 解释本课价值\n\n### 交付检查单\n\n- [ ] 失败可回滚或报错可定位\n- [ ] 与业务口径（状态机/金额）一致\n- [ ] 性能与正确性都有验收点\n- [ ] 术语与团队文档对齐\n\n### 常见追问\n\n- 生产上「OLTP vs OLAP」配错时，用户侧最先看到什么症状？\n- 你如何用一张图向后端解释本课？\n- 写出回滚/降级策略的一句话版本。\n",

              "content": "### 课前\n\n- **场景**：支付成功必须同时写订单状态与事件表，不允许只成功一半。\n- **目标**：理解原子性/一致性/隔离性/持久性在业务事务中的含义。\n- **先修**：OLTP vs OLAP → 事务边界\n\n### 样例输入\n\n与 SQL/数据库教程宪法同源四表：`users`、`orders`、`order_items`、`order_events`。\n可在 MySQL 8+ / PostgreSQL / DuckDB 上对照练习。\n\n### 是什么\n\n- **一句话定义**：事务把多步读写捆成「要么全成要么全败」的单元，并保证并发与落盘语义。\n- **拆解**：A 原子 · C 约束始终成立 · I 隔离级别 · D 提交后不怕宕机（WAL）。\n- **直觉**：转账不是两条 UPDATE，而是一个事务。\n- **边界**：跨库/跨服务需要额外模式（本地消息表、Saga），不是单机 ACID 自动覆盖。\n\n### 怎么写\n\n```sql\nSTART TRANSACTION;\n  UPDATE orders SET status='paid'\n   WHERE order_id=104 AND status='created';\n  INSERT INTO order_events(event_id, order_id, event_type, event_time)\n  VALUES (8, 104, 'paid', '2024-01-01 12:05:00');\nCOMMIT;\n-- 任一步失败：ROLLBACK；不要默默吞错\n```\n\n### 运行结果\n\n104 变为 paid，且事件表有对应 paid；中途失败则两者都不变。\n\n### 用在哪\n\n1. **资金/库存**  2. **状态机流转**  3. **审计事件同事务**\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 两表分两次自动提交 | 半成功 | 显式事务 |\n| 长事务塞报表 | 锁膨胀 | 短事务+拆分 |\n| 以为 ACID=不需备份 | 误删难回 | 备份/binlog |\n\n### 动手\n\n设计「取消订单」事务：改 status + 写事件；写出失败时如何回滚。\n\n### 对照辨析\n\n| 维度 | 「ACID」 | 易混说法 |\n|---|---|---|\n| 正确性 | 事务边界 + 约束 | 「应用保证就行」 |\n| 并发 | 隔离级别/锁/MVCC | 「开了事务就无并发问题」 |\n| 持久 | WAL/刷盘/备份 | 「提交了就永不丢」忽略介质故障 |\n\n### 最小实验\n\n1. 两会话演练：提交/回滚/并发读\n2. 故意制造冲突或长事务，观察阻塞\n3. 用官方文档核对你使用的隔离级别默认值\n\n### 交付检查单\n\n- [ ] 能画出事务成功/失败两条路径\n- [ ] 知道默认隔离级别\n- [ ] 长事务风险说得清\n- [ ] 备份与 binlog/WAL 角色不混淆\n\n### 常见追问\n\n- 生产上「ACID」配错时，用户侧最先看到什么症状？\n- 你如何用一张图向后端解释本课？\n- 写出回滚/降级策略的一句话版本。\n",

              "content": "### 课前\n\n- **场景**：听说 MySQL 要选 InnoDB，不选 MyISAM——为何？\n- **目标**：建立「引擎=存取与事务实现」的直觉；知道行存/列存差异。\n- **先修**：ACID → 下一课：主键约束\n\n### 样例输入\n\n同一逻辑表 `orders`，不同引擎能力不同。\n\n### 是什么\n\n- **一句话定义**：引擎决定如何落盘、索引、锁与是否支持事务。\n- **行存**：适合点查/更新（InnoDB）。\n- **列存**：适合宽表聚合（ClickHouse 等）。\n- **直觉**：把「存储引擎直觉」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **运维提醒**：改结构/加索引前先想清楚锁与回滚方案。\n- **直觉**：把「存储引擎直觉」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **运维提醒**：改结构/加索引前先想清楚锁与回滚方案。\n\n### 怎么写\n\n```sql\n-- MySQL：查看表引擎\nSHOW TABLE STATUS LIKE 'orders';\n-- 创建时指定（示例）\n-- CREATE TABLE orders (...) ENGINE=InnoDB;\n\n-- 思考题（不必执行）：\n-- 若 orders 无事务引擎，Q3 双写失败时能否自动回滚？\n\n-- === 验收清单 ===\n-- 1) EXPLAIN / 行数是否符合预期\n-- 2) 与业务口径（paid / 去重键）是否一致\n-- 3) 失败路径是否有 ROLLBACK / 约束报错可理解\n```\n\n### 运行结果\n\n对照样例应能指出：访问路径（是否走索引）、影响行数、事务是否同成同败。\n\n| 检查项 | 期望 |\n|---|---|\n| 结果行数 | 与手算/子查询一致 |\n| 约束冲突 | 报错信息可定位 |\n| 性能直觉 | rows / key 说得清 |\n\n**验收口令**：能向同伴口述「输入→变换→输出」三步，并指出一个反例。\n\n### 用在哪\n\n1. 建表规范  2. 迁移动力  3. HTAP/列存选型\n2. 对照相邻课做对比练习\n3. 对照相邻课做对比练习\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 新表默认不看引擎 | 无事务/无 FK | 规范强制 InnoDB |\n| 行存扛百亿明细报表 | 扫不动 | 列存/仓 |\n\n### 动手\n\n用一句话区分：Redis 是「引擎」还是「另一类数据库产品」？\n\n写一句「什么情况下我不用这个方法」。\n\n写一句「什么情况下我不用这个方法」。\n\n### 对照辨析\n\n| 维度 | 「存储引擎直觉」 | 易混概念 |\n|---|---|---|\n| 负载 | OLTP vs OLAP 放对地方 | 主库硬扛分析 |\n| 模型 | 约束与类型选对 | 全用 VARCHAR/FLOAT |\n| 运维 | 备份/复制/池化 | 只关注功能正确 |\n\n### 最小实验\n\n1. 在样例库写出最小可运行示例\n2. 做一次故意失败并记录报错\n3. 用一句话向非 DBA 解释本课价值\n\n### 交付检查单\n\n- [ ] 失败可回滚或报错可定位\n- [ ] 与业务口径（状态机/金额）一致\n- [ ] 性能与正确性都有验收点\n- [ ] 术语与团队文档对齐\n\n### 常见追问\n\n- 生产上「存储引擎直觉」配错时，用户侧最先看到什么症状？\n- 你如何用一张图向后端解释本课？\n- 写出回滚/降级策略的一句话版本。\n",

              "content": "### 课前\n\n- **场景**：列表页按 status + created_at 筛选开始变慢。\n- **目标**：理解 BTree 索引如何加速等值/范围查询，以及组合索引最左前缀。\n- **先修**：主键与约束 → EXPLAIN\n\n### 样例输入\n\n与 SQL/数据库教程宪法同源四表：`users`、`orders`、`order_items`、`order_events`。\n可在 MySQL 8+ / PostgreSQL / DuckDB 上对照练习。\n\n### 是什么\n\n- **一句话定义**：BTree（常见为 B+Tree）把键有序组织，支持快速定位与范围扫。\n- **核心**：最左前缀、选择性、回表、覆盖索引。\n- **直觉**：书的目录——先定位章节再翻页；目录本身也占空间。\n- **边界**：低基数列（如只有几个 status）单独建索引收益有限，常组合进时间列。\n\n### 怎么写\n\n```sql\n-- 组合索引：等值列在前，范围/排序列在后（常见经验）\nCREATE INDEX idx_orders_status_created ON orders (status, created_at);\n\nEXPLAIN\nSELECT order_id, amount\nFROM orders\nWHERE status='paid' AND created_at >= '2024-01-01'\nORDER BY created_at\nLIMIT 50;\n```\n\n### 运行结果\n\nEXPLAIN 中应能看到可能使用 `idx_orders_status_created`；关注 key/rows/Extra。\n\n### 用在哪\n\n1. **列表/检索接口**  2. **后台筛选**  3. **关联键加速**\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 在索引列包函数 | 索引失效 | 改写条件 |\n| 每列一个单列索引 | 优化器难选/写放大 | 按查询建组合 |\n| 只建索引不看 EXPLAIN | 主观感觉 | 用计划验证 |\n\n### 动手\n\n给「按 user_id 查最近订单」设计索引，并写一条 EXPLAIN 验证思路。\n\n### 对照辨析\n\n| 维度 | 「BTree 索引入门」 | 易混说法 |\n|---|---|---|\n| 验证 | EXPLAIN/ANALYZE | 凭感觉加索引 |\n| 设计 | 按查询建组合索引 | 每列一个索引 |\n| 代价 | 写放大与空间 | 「索引越多越快」 |\n\n### 最小实验\n\n1. 无索引 vs 有索引各跑一次 EXPLAIN\n2. 写一个索引失效条件并验证\n3. 估算 rows 与真实行数差距\n\n### 交付检查单\n\n- [ ] 关键 SQL 有执行计划截图/文字\n- [ ] 最左前缀说得清\n- [ ] 知道如何避免函数包裹索引列\n- [ ] 变更有回滚方案\n\n### 常见追问\n\n- 生产上「BTree 索引入门」配错时，用户侧最先看到什么症状？\n- 你如何用一张图向后端解释本课？\n- 写出回滚/降级策略的一句话版本。\n",

              "content": "### 课前\n\n- **场景**：明明建了索引，EXPLAIN 仍 type=ALL。\n- **目标**：识别函数包裹、隐式转换、左右模糊、低选择性等失效因。\n- **先修**：覆盖索引 → 下一课：统计信息\n\n### 样例输入\n\norders.status / created_at。\n\n### 是什么\n\n- **失效常见**：对列套函数；类型不一致；`LIKE '%xx'`；优化器估行不准。\n- **选择性**：区分度太低可能宁扫表。\n- **直觉**：把「索引失效常见因」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **运维提醒**：改结构/加索引前先想清楚锁与回滚方案。\n- **直觉**：把「索引失效常见因」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **运维提醒**：改结构/加索引前先想清楚锁与回滚方案。\n\n### 怎么写\n\n```sql\n-- 反例：函数包裹列\nEXPLAIN SELECT * FROM orders\nWHERE DATE(created_at)='2024-01-01';\n\n-- 正例：范围\nEXPLAIN SELECT * FROM orders\nWHERE created_at>='2024-01-01' AND created_at<'2024-01-02';\n\n-- 反例：隐式转换（status 数字 vs 字符串视定义）\n-- WHERE status=0 而 status 为 VARCHAR\n\n-- === 验收清单 ===\n-- 1) EXPLAIN / 行数是否符合预期\n-- 2) 与业务口径（paid / 去重键）是否一致\n-- 3) 失败路径是否有 ROLLBACK / 约束报错可理解\n```\n\n### 运行结果\n\n对照样例应能指出：访问路径（是否走索引）、影响行数、事务是否同成同败。\n\n| 检查项 | 期望 |\n|---|---|\n| 结果行数 | 与手算/子查询一致 |\n| 约束冲突 | 报错信息可定位 |\n| 性能直觉 | rows / key 说得清 |\n\n**验收口令**：能向同伴口述「输入→变换→输出」三步，并指出一个反例。\n\n### 用在哪\n\n1. 慢 SQL 首诊  2. 代码生成 SQL 审查\n2. 对照相邻课做对比练习\n3. 对照相邻课做对比练习\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| DATE(col) | 索引废 | 改范围 |\n| 前导模糊 LIKE | 难用 BTree | 搜索引擎/后缀结构 |\n\n### 动手\n\n检查业务里三条最热 SQL 是否对列套了函数。\n\n写一句「什么情况下我不用这个方法」。\n\n写一句「什么情况下我不用这个方法」。\n\n### 对照辨析\n\n| 维度 | 「索引失效常见因」 | 易混说法 |\n|---|---|---|\n| 验证 | EXPLAIN/ANALYZE | 凭感觉加索引 |\n| 设计 | 按查询建组合索引 | 每列一个索引 |\n| 代价 | 写放大与空间 | 「索引越多越快」 |\n\n### 最小实验\n\n1. 无索引 vs 有索引各跑一次 EXPLAIN\n2. 写一个索引失效条件并验证\n3. 估算 rows 与真实行数差距\n\n### 交付检查单\n\n- [ ] 关键 SQL 有执行计划截图/文字\n- [ ] 最左前缀说得清\n- [ ] 知道如何避免函数包裹索引列\n- [ ] 变更有回滚方案\n\n### 常见追问\n\n- 生产上「索引失效常见因」配错时，用户侧最先看到什么症状？\n- 你如何用一张图向后端解释本课？\n- 写出回滚/降级策略的一句话版本。\n",

              "content": "### 课前\n\n- **场景**：报表两次 SUM 不一致；或读到未提交金额。\n- **目标**：记住四级隔离与脏读/不可重复读/幻读对应关系；细节见 SQL 金课。\n- **先修**：事务边界 → 下一课：行锁与死锁\n\n### 样例输入\n\n与 SQL/数据库教程宪法同源四表：`users`、`orders`、`order_items`、`order_events`。\n可在 MySQL 8+ / PostgreSQL / DuckDB 上对照练习。\n\n### 是什么\n\n- **RU / RC / RR / Serializable**：可见性越来越严，并发度通常下降。\n- **默认**：MySQL InnoDB 常 RR；PostgreSQL 常 RC。\n- **深读**：SQL 树「隔离级别」金课。\n- **直觉**：把「隔离级别要点」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **运维提醒**：改结构/加索引前先想清楚锁与回滚方案。\n- **直觉**：把「隔离级别要点」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **运维提醒**：改结构/加索引前先想清楚锁与回滚方案。\n\n### 怎么写\n\n```sql\n-- MySQL\nSELECT @@transaction_isolation;\nSET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;\nSTART TRANSACTION;\n  SELECT user_id, SUM(COALESCE(amount,0)) gmv\n  FROM orders WHERE status='paid' GROUP BY user_id;\nCOMMIT;\n\n-- === 验收清单 ===\n-- 1) EXPLAIN / 行数是否符合预期\n-- 2) 与业务口径（paid / 去重键）是否一致\n-- 3) 失败路径是否有 ROLLBACK / 约束报错可理解\n```\n\n### 运行结果\n\n对照样例应能指出：访问路径（是否走索引）、影响行数、事务是否同成同败。\n\n| 检查项 | 期望 |\n|---|---|\n| 结果行数 | 与手算/子查询一致 |\n| 约束冲突 | 报错信息可定位 |\n| 性能直觉 | rows / key 说得清 |\n\n**验收口令**：能向同伴口述「输入→变换→输出」三步，并指出一个反例。\n\n### 用在哪\n\n1. 报表会话  2. 高并发写  3. 跨库迁移\n2. 对照相邻课做对比练习\n3. 对照相邻课做对比练习\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 生产开 RU | 脏读 | 禁止 |\n| 假设默认相同 | 隐性 bug | 显式设置/文档 |\n\n### 动手\n\n跳到 SQL 金课「隔离级别」完成双会话表。\n\n写一句「什么情况下我不用这个方法」。\n\n写一句「什么情况下我不用这个方法」。\n\n### 对照辨析\n\n| 维度 | 「隔离级别要点」 | 易混说法 |\n|---|---|---|\n| 正确性 | 事务边界 + 约束 | 「应用保证就行」 |\n| 并发 | 隔离级别/锁/MVCC | 「开了事务就无并发问题」 |\n| 持久 | WAL/刷盘/备份 | 「提交了就永不丢」忽略介质故障 |\n\n### 最小实验\n\n1. 两会话演练：提交/回滚/并发读\n2. 故意制造冲突或长事务，观察阻塞\n3. 用官方文档核对你使用的隔离级别默认值\n\n### 交付检查单\n\n- [ ] 能画出事务成功/失败两条路径\n- [ ] 知道默认隔离级别\n- [ ] 长事务风险说得清\n- [ ] 备份与 binlog/WAL 角色不混淆\n\n### 常见追问\n\n- 生产上「隔离级别要点」配错时，用户侧最先看到什么症状？\n- 你如何用一张图向后端解释本课？\n- 写出回滚/降级策略的一句话版本。\n",

              "content": "### 课前\n\n- **场景**：建模同学在订单转化/风控场景里要用到「类别编码」。\n- **目标**：吃透「类别编码」的定义、可运行写法、适用边界与常见翻车点；能独立在样例上复现。\n- **先修**：监督学习基础 + 训练/验证切分意识\n\n### 样例输入\n\n业务侧仍用同源订单样例构造特征；模型侧用 sklearn 玩具矩阵演示 API。\n约定：按时间切分训练/验证，禁止随机打乱造成穿越。\n\n### 是什么\n\n- **一句话定义**：把类别字段变成数值：独热、序号、目标编码、哈希等。\n- **核心要素**：基数、稀有类、目标编码 CV、未见类别。\n- **直觉**：把「类别编码」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **直觉**：把「类别编码」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n\n### 怎么写\n\n```python\n# === 类别编码：主路径（先跑通）===\nfrom sklearn.preprocessing import OneHotEncoder\nenc = OneHotEncoder(handle_unknown=\"ignore\", sparse_output=False)\nXtr_cat = enc.fit_transform(train[[\"city\", \"channel\"]])\nXte_cat = enc.transform(test[[\"city\", \"channel\"]])\n\n# === 验收清单 ===\n# 1) 仅在训练集 fit 预处理\n# 2) 验证集指标 + 业务分层切片\n# 3) 固定 random_state，记录数据版本\n```\n\n### 运行结果\n\n跑通后至少打印：训练集大小、验证指标、一个失败案例分析。\n\n| 检查项 | 期望 |\n|---|---|\n| 无穿越 | 时间切分严格 |\n| 可复现 | 固定种子+版本 |\n| 可解释 | 能说出主驱动特征/规则 |\n\n**验收口令**：能向同伴口述「输入→变换→输出」三步，并指出一个反例。\n\n### 用在哪\n\n1. **低基数**：城市等级、渠道 — 独热。\n2. **高基数**：店铺/商品 ID — 目标编码或哈希。\n3. **树模型**：有时直接吃整数码也行。\n\n### 易错对照\n\n| 错法 | 现象/风险 | 纠正 |\n|---|---|---|\n| 目标编码必须按折计算，防泄漏。 | 口径/效果偏差 | 对照样例复现 |\n| 线上出现新类别要有兜底桶。 | 口径/效果偏差 | 补验证集/验收SQL |\n| 独热爆炸维度时改用其他编码。 | 口径/效果偏差 | 写清边界条件 |\n\n### 动手\n\n用时间切分重跑「类别编码」；对比随机切分的指标差异，写下你会如何向业务解释。\n\n写一句「什么情况下我不用这个方法」。\n\n### 对照辨析\n\n| 维度 | 「类别编码」 | 易混替代 |\n|---|---|---|\n| 切分 | 时间切分/业务切分 | 随机打乱造成穿越 |\n| 指标 | 与业务代价对齐 | 只报准确率 |\n| 复杂度 | 先强基线 | 一上来深度网络 |\n\n### 最小实验\n\n1. 固定种子跑通主路径\n2. 对比「正确切分」vs「泄漏切分」指标差\n3. 抽 5 个坏例做误差分析并记录\n\n### 交付检查单\n\n- [ ] 标签定义成文\n- [ ] 无未来信息进特征\n- [ ] 验证/测试职责分离\n- [ ] 模型与数据版本可追溯\n\n### 常见追问\n\n- 若业务说「只要准确率」，你如何把「类别编码」翻译成代价语言？\n- 上线一周指标掉了，你先查数据、特征还是模型？\n- 什么情况下应停用本方法，换更简单/更复杂方案？\n",

              "content": "### 课前\n\n- **场景**：验证 AUC 漂亮，上线后一塌糊涂——怀疑用了未来信息。\n- **目标**：识别并切断常见数据泄露路径。\n- **先修**：特征工程总览 → 时间切分评估\n\n### 样例输入\n\n业务侧仍用同源订单样例构造特征；模型侧用 sklearn 玩具矩阵演示 API。\n约定：按时间切分训练/验证，禁止随机打乱造成穿越。\n\n### 是什么\n\n- **一句话定义**：训练时用了预测时点不可用的信息，导致离线虚高。\n- **常见源**：未来聚合、先全表编码/标准化再切分、把标签衍生列当特征、随机切时序。\n- **直觉**：考试时偷看了答案解析。\n- **边界**：允许用「截止预测时刻」的历史；不允许用「之后才产生」的字段。\n\n### 怎么写\n\n```python\n# 反例：先 fit 全数据再切分 → 泄漏\n# scaler.fit(X_all)\n\n# 正例：管道内只在训练折 fit\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import cross_val_score\n\npipe = Pipeline([\n    (\"sc\", StandardScaler()),\n    (\"clf\", LogisticRegression(max_iter=1000)),\n])\n# 时序场景请换 TimeSeriesSplit\nprint(cross_val_score(pipe, X, y, cv=5, scoring=\"roc_auc\").mean())\n```\n\n### 运行结果\n\n管道 CV 分数应低于「先全表标准化」的虚高分数。\n\n### 用在哪\n\n1. **评审查泄露清单**  2. **特征上线可用性审计**  3. **复现实验**\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 用当日总 GMV 预测当日转化 | 神准假象 | 只用过去窗口 |\n| target encoding 未隔离 | 泄漏 | 折内编码 |\n| 测试集参与选特征 | 偏乐观 | 锁定测试集 |\n\n### 动手\n\n列出你项目里 5 个字段，标注每个在预测时刻是否可得。\n\n### 对照辨析\n\n| 维度 | 「数据泄露」 | 易混替代 |\n|---|---|---|\n| 切分 | 时间切分/业务切分 | 随机打乱造成穿越 |\n| 指标 | 与业务代价对齐 | 只报准确率 |\n| 复杂度 | 先强基线 | 一上来深度网络 |\n\n### 最小实验\n\n1. 固定种子跑通主路径\n2. 对比「正确切分」vs「泄漏切分」指标差\n3. 抽 5 个坏例做误差分析并记录\n\n### 交付检查单\n\n- [ ] 标签定义成文\n- [ ] 无未来信息进特征\n- [ ] 验证/测试职责分离\n- [ ] 模型与数据版本可追溯\n\n### 常见追问\n\n- 若业务说「只要准确率」，你如何把「数据泄露」翻译成代价语言？\n- 上线一周指标掉了，你先查数据、特征还是模型？\n- 什么情况下应停用本方法，换更简单/更复杂方案？\n",

              "content": "### 课前\n\n- **场景**：建模同学在订单转化/风控场景里要用到「特征选择」。\n- **目标**：吃透「特征选择」的定义、可运行写法、适用边界与常见翻车点；能独立在样例上复现。\n- **先修**：监督学习基础 + 训练/验证切分意识\n\n### 样例输入\n\n业务侧仍用同源订单样例构造特征；模型侧用 sklearn 玩具矩阵演示 API。\n约定：按时间切分训练/验证，禁止随机打乱造成穿越。\n\n### 是什么\n\n- **一句话定义**：去掉噪声与冗余特征，提升稳定性、速度与可解释性。\n- **核心要素**：过滤法、包裹法、嵌入法、业务黑白名单。\n- **直觉**：把「特征选择」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **直觉**：把「特征选择」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n\n### 怎么写\n\n```python\n# === 特征选择：主路径（先跑通）===\nfrom sklearn.feature_selection import mutual_info_classif\nmi = mutual_info_classif(X_train, y_train, random_state=42)\nranked = sorted(zip(feature_names, mi), key=lambda x: -x[1])\nprint(ranked[:20])\n\n# === 验收清单 ===\n# 1) 仅在训练集 fit 预处理\n# 2) 验证集指标 + 业务分层切片\n# 3) 固定 random_state，记录数据版本\n```\n\n### 运行结果\n\n跑通后至少打印：训练集大小、验证指标、一个失败案例分析。\n\n| 检查项 | 期望 |\n|---|---|\n| 无穿越 | 时间切分严格 |\n| 可复现 | 固定种子+版本 |\n| 可解释 | 能说出主驱动特征/规则 |\n\n**验收口令**：能向同伴口述「输入→变换→输出」三步，并指出一个反例。\n\n### 用在哪\n\n1. **高维表格**：先滤再训。\n2. **解释性要求高**：留可讲清的特征。\n3. **线上成本**：砍掉计算贵、增益低的特征。\n\n### 易错对照\n\n| 错法 | 现象/风险 | 纠正 |\n|---|---|---|\n| 只看训练集重要性会过拟合选择。 | 口径/效果偏差 | 对照样例复现 |\n| 相关≠因果，勿删业务硬约束特征。 | 口径/效果偏差 | 补验证集/验收SQL |\n| 选择结果要随数据重跑，不是一次定终身。 | 口径/效果偏差 | 写清边界条件 |\n\n### 动手\n\n用时间切分重跑「特征选择」；对比随机切分的指标差异，写下你会如何向业务解释。\n\n写一句「什么情况下我不用这个方法」。\n\n### 对照辨析\n\n| 维度 | 「特征选择」 | 易混替代 |\n|---|---|---|\n| 切分 | 时间切分/业务切分 | 随机打乱造成穿越 |\n| 指标 | 与业务代价对齐 | 只报准确率 |\n| 复杂度 | 先强基线 | 一上来深度网络 |\n\n### 最小实验\n\n1. 固定种子跑通主路径\n2. 对比「正确切分」vs「泄漏切分」指标差\n3. 抽 5 个坏例做误差分析并记录\n\n### 交付检查单\n\n- [ ] 标签定义成文\n- [ ] 无未来信息进特征\n- [ ] 验证/测试职责分离\n- [ ] 模型与数据版本可追溯\n\n### 常见追问\n\n- 若业务说「只要准确率」，你如何把「特征选择」翻译成代价语言？\n- 上线一周指标掉了，你先查数据、特征还是模型？\n- 什么情况下应停用本方法，换更简单/更复杂方案？\n",

              "content": "### 课前\n\n- **场景**：建模同学在订单转化/风控场景里要用到「特征漂移」。\n- **目标**：吃透「特征漂移」的定义、可运行写法、适用边界与常见翻车点；能独立在样例上复现。\n- **先修**：监督学习基础 + 训练/验证切分意识\n\n### 样例输入\n\n业务侧仍用同源订单样例构造特征；模型侧用 sklearn 玩具矩阵演示 API。\n约定：按时间切分训练/验证，禁止随机打乱造成穿越。\n\n### 是什么\n\n- **一句话定义**：线上特征分布相对训练期发生变化，模型分数失效。\n- **核心要素**：PSI/KL、分位数监控、分段报警、再训练触发。\n- **直觉**：把「特征漂移」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **直觉**：把「特征漂移」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n\n### 怎么写\n\n```python\n# === 特征漂移：主路径（先跑通）===\nimport numpy as np\ndef psi(expected, actual, bins=10):\n    qs = np.linspace(0, 100, bins + 1)\n    cuts = np.percentile(expected, qs)\n    e_hist = np.histogram(expected, bins=cuts)[0] + 1e-6\n    a_hist = np.histogram(actual, bins=cuts)[0] + 1e-6\n    e_p, a_p = e_hist / e_hist.sum(), a_hist / a_hist.sum()\n    return np.sum((a_p - e_p) * np.log(a_p / e_p))\n\n# === 验收清单 ===\n# 1) 仅在训练集 fit 预处理\n# 2) 验证集指标 + 业务分层切片\n# 3) 固定 random_state，记录数据版本\n```\n\n### 运行结果\n\n跑通后至少打印：训练集大小、验证指标、一个失败案例分析。\n\n| 检查项 | 期望 |\n|---|---|\n| 无穿越 | 时间切分严格 |\n| 可复现 | 固定种子+版本 |\n| 可解释 | 能说出主驱动特征/规则 |\n\n**验收口令**：能向同伴口述「输入→变换→输出」三步，并指出一个反例。\n\n### 用在哪\n\n1. **日更打分表**：监控 top 特征 PSI。\n2. **活动/疫情冲击**后诊断。\n3. **新渠道流量**占比变化。\n\n### 易错对照\n\n| 错法 | 现象/风险 | 纠正 |\n|---|---|---|\n| PSI 高不等于一定掉业务，要联看效果指标。 | 口径/效果偏差 | 对照样例复现 |\n| 离散特征用占比变化，不要硬套数值 PSI。 | 口径/效果偏差 | 补验证集/验收SQL |\n| 先修数据质量，再怪模型。 | 口径/效果偏差 | 写清边界条件 |\n\n### 动手\n\n用时间切分重跑「特征漂移」；对比随机切分的指标差异，写下你会如何向业务解释。\n\n写一句「什么情况下我不用这个方法」。\n\n### 对照辨析\n\n| 维度 | 「特征漂移」 | 易混替代 |\n|---|---|---|\n| 切分 | 时间切分/业务切分 | 随机打乱造成穿越 |\n| 指标 | 与业务代价对齐 | 只报准确率 |\n| 复杂度 | 先强基线 | 一上来深度网络 |\n\n### 最小实验\n\n1. 固定种子跑通主路径\n2. 对比「正确切分」vs「泄漏切分」指标差\n3. 抽 5 个坏例做误差分析并记录\n\n### 交付检查单\n\n- [ ] 标签定义成文\n- [ ] 无未来信息进特征\n- [ ] 验证/测试职责分离\n- [ ] 模型与数据版本可追溯\n\n### 常见追问\n\n- 若业务说「只要准确率」，你如何把「特征漂移」翻译成代价语言？\n- 上线一周指标掉了，你先查数据、特征还是模型？\n- 什么情况下应停用本方法，换更简单/更复杂方案？\n",

              "content": "### 课前\n\n- **场景**：建模同学在订单转化/风控场景里要用到「K 近邻」。\n- **目标**：吃透「K 近邻」的定义、可运行写法、适用边界与常见翻车点；能独立在样例上复现。\n- **先修**：监督学习基础 + 训练/验证切分意识\n\n### 样例输入\n\n业务侧仍用同源订单样例构造特征；模型侧用 sklearn 玩具矩阵演示 API。\n约定：按时间切分训练/验证，禁止随机打乱造成穿越。\n\n### 是什么\n\n- **一句话定义**：用最相似的 K 个训练样本投票或平均，惰性学习。\n- **核心要素**：`k`、距离度量、缩放、KD/球树。\n- **直觉**：把「K 近邻」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n- **直觉**：把「K 近邻」想成工作流里的一个可复用积木——输入明确、输出可验收。\n- **边界**：能说清「什么时候不该用」比背 API 更重要；本课易错表会反复强调。\n- **对照**：学完后应能向同事用业务语言解释「为什么选它而不是相邻方案」。\n\n### 怎么写\n\n```python\n# === K 近邻：主路径（先跑通）===\nfrom sklearn.neighbors import KNeighborsClassifier\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import Pipeline\nknn = Pipeline([\n    (\"sc\", StandardScaler()),\n    (\"knn\", KNeighborsClassifier(n_neighbors=15, weights=\"distance\")),\n])\nknn.fit(X_train, y_train)\n\n# === 验收清单 ===\n# 1) 仅在训练集 fit 预处理\n# 2) 验证集指标 + 业务分层切片\n# 3) 固定 random_state，记录数据版本\n```\n\n### 运行结果\n\n跑通后至少打印：训练集大小、验证指标、一个失败案例分析。\n\n| 检查项 | 期望 |\n|---|---|\n| 无穿越 | 时间切分严格 |\n| 可复现 | 固定种子+版本 |\n| 可解释 | 能说出主驱动特征/规则 |\n\n**验收口令**：能向同伴口述「输入→变换→输出」三步，并指出一个反例。\n\n### 用在哪\n\n1. **小数据集**快速基线。\n2. **异常**：远离邻居的点。\n3. **推荐召回**的相似度思想同源。\n\n### 易错对照\n\n| 错法 | 现象/风险 | 纠正 |\n|---|---|---|\n| 高维会失效（维度灾难）。 | 口径/效果偏差 | 对照样例复现 |\n| 预测期要扫训练集，大数据慢。 | 口径/效果偏差 | 补验证集/验收SQL |\n| 必须标准化。 | 口径/效果偏差 | 写清边界条件 |\n\n### 动手\n\n用时间切分重跑「K 近邻」；对比随机切分的指标差异，写下你会如何向业务解释。\n\n写一句「什么情况下我不用这个方法」。\n\n### 对照辨析\n\n| 维度 | 「K 近邻」 | 易混替代 |\n|---|---|---|\n| 切分 | 时间切分/业务切分 | 随机打乱造成穿越 |\n| 指标 | 与业务代价对齐 | 只报准确率 |\n| 复杂度 | 先强基线 | 一上来深度网络 |\n\n### 最小实验\n\n1. 固定种子跑通主路径\n2. 对比「正确切分」vs「泄漏切分」指标差\n3. 抽 5 个坏例做误差分析并记录\n\n### 交付检查单\n\n- [ ] 标签定义成文\n- [ ] 无未来信息进特征\n- [ ] 验证/测试职责分离\n- [ ] 模型与数据版本可追溯\n\n### 常见追问\n\n- 若业务说「只要准确率」，你如何把「K 近邻」翻译成代价语言？\n- 上线一周指标掉了，你先查数据、特征还是模型？\n- 什么情况下应停用本方法，换更简单/更复杂方案？\n",

              "content": "### 课前 · 这是什么\n\n本页是 **ETL 教程公约**：认源→抽取→转换→装载→校验→调度。与 SQL / 数仓 / Python **同源样例**（`users` / `orders` / `order_items` / `order_events`）。先读本页，再按清单上课；所有金课的验收数字都以本页为准。\n\n### 统一样例（源系统视角）\n\n把四表当成业务库 OLTP；ETL 日作业产出仓表（示意）：\n\n| 层 | 表示意 | 来源 | ETL 职责 |\n|---|---|---|---|\n| ODS | `ods_orders_di` | 贴源 orders + dt | 保真落地、可重抽 |\n| DWD | `dwd_trade_pay_di` | 清洗后的 paid 明细 | 去重/空值/口径 |\n| DIM | `dim_user` | users（可 SCD2） | 维表日批/闭链 |\n| DQ | 对账结果 | 行数/金额闭合 | 门禁，失败不放行 |\n\n**验收种子**：users=4，orders=8，order_events=7，order_items=5。  \n**支付口径**：`status='paid'` + `SUM(COALESCE(amount,0))`（含 amount 为 NULL 的单记 0）。\n\n### 三条铁律（贯穿全树）\n\n1. **契约先于代码**：主键、水位、枚举、空值语义写进清单。  \n2. **幂等先于重试**：同一窗口重跑结果不变，才能开自动重试。  \n3. **门禁先于消费**：行数/唯一/金额对账通过后，下游才可读。\n\n### 金标准课模板\n\n课前 → 样例输入 → 是什么 → 怎么写 → 结果 → 用在哪 → 易错对照 → 动手。\n\n### 学习主线\n\n```text\n宪法 → 认源/契约/SLA → 全量/增量/CDC\n→ 清洗去重/维关联/SCD/脱敏 → 覆盖·MERGE·幂等\n→ 行数唯一对账 → DAG·重试·回填·迟到\n→ ETL vs ELT → Airflow/dbt/DataX/Airbyte/Flink CDC\n→ 血缘·发布回滚 → 练习场\n```\n\n\n### 教义深讲\n\n围绕「统一样例与课模板」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n",

              "content": "### 课前\n\n- **场景**：要近实时同步订单状态，又不能轮询整表。\n- **目标**：理解 CDC 读日志（binlog/WAL）；知道排序与去重。\n- **先修**：增量 → 下一课：类型与空值\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\norder_events 可模拟变更流。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/数仓一致）。\n\n### 是什么\n\n- **CDC**：从数据库日志捕获增删改。\n- **组件**：Debezium / Flink CDC → Kafka → 装载。\n- **注意**：schema 变更、恰好一次、乱序。\n\n**教义锚点**：先定主键、粒度、时间字段与成功判据，再写管道；没有验收标准的作业不算上线。\n\n### 怎么写\n\n**建议步骤**\n\n1. 对齐源表主键 / 水位 / 分区 dt  \n2. 按下述模板改到你的库表名  \n3. 用「查询结果」做行数或金额闭合  \n4. 对照易错表排除反模式后再排进 DAG  \n\n```sql\n-- 用事件表模拟「变更流」并取最新\nSELECT * FROM (\n  SELECT e.*, ROW_NUMBER() OVER (\n    PARTITION BY order_id, event_type\n    ORDER BY event_time DESC, event_id DESC) rn\n  FROM order_events e\n) t WHERE rn=1;\n```\n\n### 查询结果\n\n每组事件类型保留最新一条（演示流上的压缩）。\n\n### 用在哪\n\n1. 近实时数仓  2. 微服务同步  3. 审计\n\n**上下游**：上游契约决定你能抽到什么；下游（DWD/ADS/BI）决定口径、SLA 与能否重跑。\n\n### 易错对照\n\n| 错法 | 纠正 |\n|---|---|\n| 当银弹替代建模 | 仍要分层 | CDC+仓模型 |\n| 忽略删事件 | 目标脏 | 处理 DELETE |\n\n\n\n### 教义深讲\n\n围绕「CDC 变更捕获」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n说明：CDC 后为何还要 ODS/DWD，而不是直写看板。",

              "content": "### 课前\n\n- **场景**：事实要带城市，但直接 JOIN 明细会炸 GMV。\n- **目标**：先定粒度；维关联用键；一对多先聚合。\n- **先修**：去重 → 下一课：SCD\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\norders ⋈ users；orders ⋈ items。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/数仓一致）。\n\n### 是什么\n\n- **关联**：补维度属性。\n- **纪律**：防 JOIN 爆炸（先聚合 items）。\n\n**教义锚点**：先定主键、粒度、时间字段与成功判据，再写管道；没有验收标准的作业不算上线。\n\n### 怎么写\n\n**建议步骤**\n\n1. 对齐源表主键 / 水位 / 分区 dt  \n2. 按下述模板改到你的库表名  \n3. 用「查询结果」做行数或金额闭合  \n4. 对照易错表排除反模式后再排进 DAG  \n\n```sql\n-- 安全：订单头 + 用户\nSELECT o.order_id, o.amount, u.city\nFROM orders o\nLEFT JOIN users u ON u.user_id=o.user_id\nWHERE o.status='paid';\n\n-- 危险对照：先 JOIN items 再 SUM(amount)\n-- 正确：items 先 COUNT 再关联\n```\n\n### 查询结果\n\n城市补全；金额不被 items 放大。\n\n### 用在哪\n\n1. DWD 宽出  2. 特征拼接\n\n**上下游**：上游契约决定你能抽到什么；下游（DWD/ADS/BI）决定口径、SLA 与能否重跑。\n\n### 易错对照\n\n| 错法 | 纠正 |\n|---|---|\n| 多事实互 JOIN 再 SUM | 分过程汇总 |\n| 丢失维用 inner | 视需求 left |\n\n\n\n### 教义深讲\n\n围绕「维表关联」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n写出 sku_cnt 关联的正确 SQL。",

              "level": "?",
              "content": "### 课前\n\n- **场景**：营销、财务、数据三套 GMV 对不上。\n- **目标**：理解 SSOT：同一指标应追溯到同一层定义。\n- **先修**：仓是什么 → 下一课：ODS\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\npaid GMV 应用户汇总。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **SSOT**：Single Source of Truth——可审计的权威口径落点。\n- **实践**：原子指标沉在 DWD/DWS，ADS 只做取用与展示。\n- **不是**：强行只留一张物理表，而是**治理上的权威定义**。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\n-- 权威口径示意（DWS）\nCREATE VIEW dws_user_pay_gmv AS\nSELECT user_id,\n       SUM(COALESCE(amount,0)) AS gmv,\n       COUNT(*) AS pay_cnt\nFROM orders\nWHERE status='paid'\nGROUP BY user_id;\n\n-- ADS/看板应读视图，而不是各自重写 WHERE\n```\n\n### 查询结果\n\n三方都读 `dws_user_pay_gmv` 时 Ada=350 对齐。\n\n### 用在哪\n\n1. 指标治理  2. 口径争议仲裁  3. 与 BI 课衔接\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 每个看板私有 SQL | 数不一致 | 下沉公共汇总 |\n| 把 ODS 当 SSOT | 源脏/无业务清洗 | SSOT 在清洗后层 |\n\n\n\n### 教义深讲\n\n围绕「SSOT 单一事实来源」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n列出你们公司一个「必须 SSOT」的指标，并说它应落在哪一层。",

              "id": "dwh-subject-domain",
              "title": "主题域",
              "level": "?",
              "content": "### 课前\n\n- **场景**：交易、用户、营销各写各的表，口径无法复用。\n- **目标**：按业务主题划分可治理边界，明确 Owner 与共用维度。\n- **先修**：仓是什么 / SSOT\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\n交易域：orders/items/events；用户域：users。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`。\n\n### 是什么\n\n- **主题域**：按业务能力切分的数据责任边界（如交易、用户、存货）。\n- **不是**：物理库名的同义词；也不是「一张超级宽表」。\n- **价值**：总线矩阵、一致性维度、跨域指标才有谈判桌。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）\n2. 按下述 SQL/DDL 改到你的主题域\n3. 用「查询结果」与源或上一层做闭合\n4. 对照易错表，确认没有把口径写进错误的层\n\n```sql\n-- 域清单（文档）\n-- domain | owner | core_tables\n-- trade  | de-a  | orders, order_items, order_events\n-- user   | de-b  | users\nSELECT 'trade' AS domain, COUNT(*) AS orders_n FROM orders;\n```\n\n### 查询结果\n\n域有 Owner；跨域取数走一致性维度，而不是复制私有用户维。\n\n### 用在哪\n\n1. 立项拆域  2. 总线建模  3. 与组织职责对齐\n\n**上下游**：与 ETL 调度/对账课、BI 指标课对照学习。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 按团队随便拆表 | 同名不同义 | 按业务能力定域 |\n| 域内私有用户维 | 城市对不上 | 一致性维度 |\n| 域=全部历史明细无治理 | 沼泽 | 分层+粒度 |\n\n### 教义深讲\n\n围绕「主题域」记住：可复现、可重跑、可追溯。支付口径统一 `status='paid'` + `COALESCE(amount,0)`。\n\n### 动手\n\n给本样例画交易域/用户域两框，并标出共用维度。",

              "title": "集市 vs 仓库",
              "level": "?",
              "content": "### 课前\n\n- **场景**：业务要「营销专用宽表」，数据团队担心变成烟囱。\n- **目标**：分清企业仓（可复用）与集市（部门消费）的边界。\n- **先修**：主题域\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nADS 营销看板 vs DWD 支付明细。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`。\n\n### 是什么\n\n- **仓库**：面向主题、可共享的集成层（DWD/DWS 主力）。\n- **集市**：面向部门/应用的消费集（常落 ADS）。\n- **纪律**：集市可以快，但不能成为第二套 SSOT。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）\n2. 按下述 SQL/DDL 改到你的主题域\n3. 用「查询结果」与源或上一层做闭合\n4. 对照易错表，确认没有把口径写进错误的层\n\n```sql\n-- 仓：可复用支付事实\nSELECT order_id, user_id, COALESCE(amount,0) pay_amt\nFROM orders WHERE status='paid';\n-- 集市：营销只要高价值用户清单（ADS）\nSELECT user_id, SUM(COALESCE(amount,0)) gmv\nFROM orders WHERE status='paid'\nGROUP BY user_id HAVING SUM(COALESCE(amount,0))>=200;\n```\n\n### 查询结果\n\n仓侧明细可复用；集市只是过滤/展示，不改支付定义。\n\n### 用在哪\n\n1. 需求评审  2. 防止烟囱指标  3. 与 BI 工作区治理\n\n**上下游**：与 ETL 调度/对账课、BI 指标课对照学习。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 集市重定义 GMV | 数对不上 | 读 DWS |\n| 拒绝一切集市 | 交付慢 | ADS 允许、口径下沉 |\n| 集市直连 ODS | 脏口径 | 经 DWD |\n\n### 教义深讲\n\n围绕「集市 vs 仓库」记住：可复现、可重跑、可追溯。支付口径统一 `status='paid'` + `COALESCE(amount,0)`。\n\n### 动手\n\n判断「运营日报」应是仓还是集市，一句话理由。",

              "content": "### 课前\n\n- **场景**：看板每天都算「用户 GMV、支付笔数」，不想每次扫明细。\n- **目标**：按主题建轻度汇总；保持与 DWD 可对账。\n- **先修**：DWD → 下一课：ADS\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\ndwd 支付明细或直接 orders paid。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **一句话定义**：面向主题的汇总数据层（用户/商品/渠道等）。\n- **原则**：公共汇总下沉；与明细可对上。\n- **注意**：汇总键与时间周期（日/周）写进表名或字段。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\n-- 用户支付汇总（示意 DWS）\nSELECT\n  user_id,\n  SUM(COALESCE(amount,0)) AS gmv,\n  COUNT(*) AS pay_cnt\nFROM orders\nWHERE status='paid'\nGROUP BY user_id\nORDER BY gmv DESC;\n```\n\n### 查询结果\n\n| user_id | gmv | pay_cnt |\n|---:|---:|---:|\n| 1 | 350 | 4 |\n| 2 | 90 | 1 |\n| 3 | 0 | 1 |\n\n### 用在哪\n\n1. 高频看板  2. 主题宽表  3. 减少重复计算\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 汇总后无法还原争议 | 扯皮 | 保留 DWD 对账路径 |\n| 主题混杂一张上帝表 | 难维护 | 按域拆分 |\n\n\n\n### 教义深讲\n\n围绕「DWS 汇总」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n加一列 `gmv_nonnull`：只对 amount IS NOT NULL 求和，与 fill 0 对比。",

              "content": "### 课前\n\n- **场景**：运营只要「高价值用户名单」，不要自己写汇总 SQL。\n- **目标**：在 ADS 提供接近产品的接口表/视图。\n- **先修**：DWS → 下一课：粒度\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nDWS 用户 GMV。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **一句话定义**：面向应用/报表的数据服务层。\n- **特点**：强业务语义、可含展示字段、可适度冗余。\n- **纪律**：尽量读 DWS/DWD，不直连 ODS 拼口径。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\nSELECT user_id, gmv,\n  CASE WHEN gmv>=300 THEN 'H' WHEN gmv>=100 THEN 'M' ELSE 'L' END AS tier\nFROM (\n  SELECT user_id, SUM(COALESCE(amount,0)) AS gmv\n  FROM orders WHERE status='paid' GROUP BY user_id\n) t\nORDER BY gmv DESC;\n```\n\n### 查询结果\n\nAda=H，Bob=L，Cara=L。\n\n### 用在哪\n\n1. 看板数据集  2. 服务 API 表  3. 运营圈选\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| ADS 各自算原子指标 | 口径漂移 | 原子在 DWD/DWS |\n| ADS 很重又被多人改 | 不稳定 | 权限+发布 |\n\n\n\n### 教义深讲\n\n围绕「ADS 应用」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n设计一张 ADS：近 7 日每日 GMV（用样例日期）。",

              "content": "### 课前\n\n- **场景**：用户维里城市还要挂「城市→省份→大区」层级，想省存储、强约束。\n- **目标**：理解雪花=维度再规范化分层；会算多一跳 JOIN 的代价。\n- **先修**：星型模型 → 下一课：星系模型\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\n把 users.city 扩展为地区层级（示意表）。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **雪花（Snowflake）**：维度表继续拆成子维，呈雪花状。\n- **相对星型**：更省空间、更易维护层级；**查询多 JOIN**，对分析师不友好。\n- **现代实践**：很多团队仍用星型，层级用桥接表/扁平属性折中。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\n-- 雪花示意：用户 → 城市 → 省份\n-- dim_user(user_id, user_name, city_id)\n-- dim_city(city_id, city_name, province_id)\n-- dim_province(province_id, province_name)\n\n-- 等价查询（比星型多一跳）\n-- SELECT p.province_name, SUM(f.pay_amt)\n-- FROM fact_pay f\n-- JOIN dim_user u ON u.user_sk = f.user_sk\n-- JOIN dim_city c ON c.city_id = u.city_id\n-- JOIN dim_province p ON p.province_id = c.province_id\n-- GROUP BY p.province_name;\n\n-- 样例库扁平写法（星型友好）：城市直接挂在 users\nSELECT COALESCE(city,'未知') city, COUNT(*) \nFROM users GROUP BY 1;\n```\n\n### 查询结果\n\n雪花路径更长；本教程样例用扁平 city 模拟星型侧。\n\n### 用在哪\n\n1. 深层级地理/组织  2. 存储敏感  3. 规范化要求高的场景\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 无必要全面雪花化 | SQL 又长又慢 | 默认星型，热点层级再拆 |\n| 雪花与星型混叫 | 沟通混乱 | 评审写明形态 |\n\n\n\n### 教义深讲\n\n围绕「雪花模型」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n若「SKU→品类→大类」三层，画雪花与「品类属性打平进商品维」两种方案。",

              "content": "### 课前\n\n- **场景**：支付事实与加购事实都要连同一张用户维、日期维。\n- **目标**：理解多事实共享维的星系（星座）模型；对接总线矩阵。\n- **先修**：雪花 → 下一课：何时用哪种\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\n过程：支付 +（想象）加购；共享 users。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **星系/星座（Fact Constellation）**：多张事实表共享一致性维度。\n- **与总线**：总线矩阵正是规划「哪些过程共享哪些维」。\n- **注意**：不同事实粒度不同，不可随意 UNION 度量。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\n-- 事实1：支付（订单头粒度）\n-- fact_pay(order_id, user_id, dt, pay_amt)\n\n-- 事实2：订单行（SKU 粒度）——同构样例 order_items\n-- fact_order_item(order_id, sku_id, user_id, dt, qty)\n\n-- 共享维：users / 日期\nSELECT u.user_name,\n       SUM(COALESCE(o.amount,0)) AS gmv,\n       SUM(i.qty) AS qty_sum\nFROM users u\nLEFT JOIN orders o\n  ON o.user_id=u.user_id AND o.status='paid'\nLEFT JOIN order_items i ON i.order_id=o.order_id\nGROUP BY u.user_name;\n-- 注意：qty 与 gmv 同查时要防 amount 被 items 放大（应分事实分别汇总再外连）\n```\n\n### 查询结果\n\n星系允许多过程并存；混粒度 JOIN 仍可能爆炸——分过程汇总是纪律。\n\n### 用在哪\n\n1. 企业级多主题  2. 总线落地  3. 跨过程对比分析\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 多事实直接互 JOIN 再 SUM | 放大 | 各事实先聚合到维键 |\n| 维表各主题翻版 | 对不齐 | 一致性维 |\n\n\n\n### 教义深讲\n\n围绕「星系/星座模型」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n用总线矩阵为「支付」「退款」打两行，标共享维。",

              "content": "### 课前\n\n- **场景**：要把支付过程沉淀为可累加指标表。\n- **目标**：区分事务事实；度量可加；外键连维。\n- **先修**：形态选型 / 总线 → 下一课：维度表\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\npaid 订单。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **事实表**：记录业务过程，含外键 + 可加度量。\n- **类型**：事务事实、周期快照、累计快照（先掌握事务）。\n- **度量**：`pay_amt`、`pay_cnt`（常为 1）。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\n-- 事务事实：支付成功\nSELECT\n  order_id AS pay_id,\n  user_id,\n  DATE(created_at) AS dt,\n  COALESCE(amount,0) AS pay_amt,\n  1 AS pay_cnt\nFROM orders\nWHERE status='paid';\n```\n\n### 查询结果\n\n每笔支付一行；Ada 四笔度量可 SUM。\n\n### 用在哪\n\n1. 主题明细  2. 汇总来源  3. 对账\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 把不可加指标当度量乱 SUM | 比率错误 | 比率放 ADS/计算 |\n| 事实表塞大量文本 | 膨胀 | 进维表 |\n\n\n\n### 教义深讲\n\n围绕「事实表」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n说明：订单「状态」更适合当维属性还是度量？",

              "content": "### 课前\n\n- **场景**：报表要按城市看 GMV，需要用户维。\n- **目标**：会设计维表字段；理解退化维。\n- **先修**：事实表 → 下一课：代理键\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nusers + 支付事实。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **维度表**：描述「谁/何处/何时/何物」的上下文。\n- **退化维**：订单号等可直接放事实的短码。\n- **查询**：事实 JOIN 维再按维属性 GROUP。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\nSELECT\n  COALESCE(u.city, '未知') AS city,\n  SUM(COALESCE(o.amount,0)) AS gmv\nFROM orders o\nJOIN users u ON u.user_id = o.user_id\nWHERE o.status='paid'\nGROUP BY COALESCE(u.city, '未知');\n```\n\n### 查询结果\n\n上海 / 北京 等城市 GMV；Dan 无支付不出现。\n\n### 用在哪\n\n1. 下钻分析  2. 一致性维  3. 标签来源\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 维表无主键 | 一对多放大 | 用户一行（或 SCD 版本行） |\n| 城市在事实里重复字符串 | 难变更历史 | 维表+键 |\n\n\n\n### 教义深讲\n\n围绕「维度表」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n把 `status` 做成退化维还是小维表？写你的选择理由。",

              "content": "### 课前\n\n- **场景**：支付、下单、快照库存混在一张「事实」里。\n- **目标**：区分事务事实、周期快照、累积快照。\n- **先修**：事实表 / 粒度\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\norders 支付可作事务事实；若跟踪订单状态流转可作累积快照。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`。\n\n### 是什么\n\n- **事务事实**：业务事件发生即记一行（支付成功）。\n- **周期快照**：固定时间点切片（每日库存）。\n- **累积快照**：生命周期里程碑列（下单/支付/发货时间）。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）\n2. 按下述 SQL/DDL 改到你的主题域\n3. 用「查询结果」与源或上一层做闭合\n4. 对照易错表，确认没有把口径写进错误的层\n\n```sql\n-- 事务事实（支付）\nSELECT order_id, user_id, COALESCE(amount,0) AS pay_amt, created_at AS pay_at\nFROM orders WHERE status='paid';\n-- 累积快照示意：订单里程碑\n-- order_id, created_at, paid_at, cancelled_at\n```\n\n### 查询结果\n\n支付事实一行一事件；不要把库存日快照塞进同一粒度。\n\n### 用在哪\n\n1. 建模评审  2. 选择分区键  3. 与过程分析\n\n**上下游**：与 ETL 调度/对账课、BI 指标课对照学习。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 混粒度一张表 | 汇总错 | 拆事实 |\n| 用事务表硬模拟快照 | 补数难 | 独立快照作业 |\n| 累积快照无闭链规则 | 状态乱 | 明确更新列 |\n\n### 教义深讲\n\n围绕「事实类型」记住：可复现、可重跑、可追溯。支付口径统一 `status='paid'` + `COALESCE(amount,0)`。\n\n### 动手\n\norder_events 更像哪类事实？为什么。",

              "title": "宽表 vs 指标下沉",
              "level": "??",
              "content": "### 课前\n\n- **场景**：有人要「一张覆盖所有字段的宽表」，有人要指标平台。\n- **目标**：会在宽出与指标下沉之间做取舍。\n- **先修**：DWS / ADS / SSOT\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\n用户日 GMV 既可宽表字段，也可指标服务。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`。\n\n### 是什么\n\n- **宽表**：少 JOIN、取数快，易膨胀与口径漂移。\n- **指标下沉**：原子/派生指标沉在 DWS/语义层，消费方组合。\n- **实践**：明细保粒度；高频指标物化；避免「万能宽表」。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）\n2. 按下述 SQL/DDL 改到你的主题域\n3. 用「查询结果」与源或上一层做闭合\n4. 对照易错表，确认没有把口径写进错误的层\n\n```sql\n-- 下沉：可复用汇总\nCREATE VIEW dws_user_pay_gmv AS\nSELECT user_id, SUM(COALESCE(amount,0)) gmv, COUNT(*) pay_cnt\nFROM orders WHERE status='paid' GROUP BY user_id;\n-- 宽出：仅 ADS 组装展示字段，不改 gmv 定义\n```\n\n### 查询结果\n\nAda gmv=350 来自同一视图，不论几个看板。\n\n### 用在哪\n\n1. 性能与治理平衡  2. BI 语义层  3. 防止烟囱\n\n**上下游**：与 ETL 调度/对账课、BI 指标课对照学习。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 万能宽表私有口径 | 对不齐 | 指标下沉 |\n| 只有指标没有明细 | 无法下钻 | 保留 DWD |\n| 宽表当 ODS | 难重跑 | 分层 |\n\n### 教义深讲\n\n围绕「宽表 vs 指标下沉」记住：可复现、可重跑、可追溯。支付口径统一 `status='paid'` + `COALESCE(amount,0)`。\n\n### 动手\n\n列出 2 个该下沉的指标、1 个可留在 ADS 的展示字段。",

              "content": "### 课前\n\n- **场景**：交易域与营销域各自有一份 users，城市对不上。\n- **目标**：理解一致性维度：跨主题可对齐的公共维。\n- **先修**：维度 / 总线矩阵\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nusers 作为公共用户维。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`。\n\n### 是什么\n\n- **一致性维度**：多事实/多集市共用、属性同名同义。\n- **手段**：公共 DIM、代理键、变更走 SCD 规范。\n- **总线**：事实挂到同一组一致性维上才能跨域分析。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）\n2. 按下述 SQL/DDL 改到你的主题域\n3. 用「查询结果」与源或上一层做闭合\n4. 对照易错表，确认没有把口径写进错误的层\n\n```sql\n-- 两事实都挂同一用户维\nSELECT o.order_id, u.city, COALESCE(o.amount,0) pay_amt\nFROM orders o\nJOIN users u ON u.user_id=o.user_id\nWHERE o.status='paid';\n```\n\n### 查询结果\n\n城市来自同一维，跨报表可比。\n\n### 用在哪\n\n1. 跨域分析  2. 总线实施  3. 治理争议仲裁\n\n**上下游**：与 ETL 调度/对账课、BI 指标课对照学习。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 每集市复制维 | 同名不同义 | 公共 DIM |\n| 自然键当唯一真相 | 源合并冲突 | 代理键 |\n| 维属性随意改名 | 报表裂 | 词典治理 |\n\n### 教义深讲\n\n围绕「一致性维度」记住：可复现、可重跑、可追溯。支付口径统一 `status='paid'` + `COALESCE(amount,0)`。\n\n### 动手\n\ndate_dim / user_dim 哪个必须一致性？举例。",

              "content": "### 课前\n\n- **场景**：用户改名，历史报表不需要旧名。\n- **目标**：掌握 SCD1：直接覆盖，不保留历史。\n- **先修**：代理键 → 下一课：SCD2\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nusers.user_name 变更场景。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **SCD1**：新值覆盖旧值，无历史。\n- **适用**：纠错、不关心历史属性。\n- **代价**：无法回答「当时叫什么」。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\n-- SCD1 示意\nUPDATE users SET user_name = 'Ada Lovelace' WHERE user_id=1;\nSELECT * FROM users WHERE user_id=1;\n```\n\n### 查询结果\n\n只见新名；旧名消失。\n\n### 用在哪\n\n1. 主数据纠错  2. 不需要历史的属性\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 该留历史却用 SCD1 | 审计失败 | 改 SCD2 |\n| 全字段 SCD1 | 误覆盖关键史 | 按字段策略 |\n\n\n\n### 教义深讲\n\n围绕「SCD1 覆盖」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n判断：手机号纠错 vs 会员等级变迁，谁更适合 SCD1？",

              "content": "### 课前\n\n- **场景**：Dan 城市从空变为上海，下单时城市要可回放。\n- **目标**：会闭链旧行 + 插入新行；点时间查询。\n- **先修**：SCD1 → 下一课：增量策略\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nusers_scd2 练习表（勿破坏分析用 users 主数据时可另建）。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **SCD2**：保留历史版本（valid_from/to, is_current）。\n- **动作**：变更时闭链，再插新版本。\n- **关联**：事实按事件时间找维版本。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\nCREATE TABLE IF NOT EXISTS users_scd2 (\n  user_id INT, user_name VARCHAR(32), city VARCHAR(32),\n  valid_from TIMESTAMP, valid_to TIMESTAMP, is_current INT,\n  PRIMARY KEY(user_id, valid_from)\n);\n-- 初始 + 变更步骤见 SQL「拉链表 SCD2」金课同构写法\nUPDATE users_scd2 SET valid_to='2024-02-01', is_current=0\nWHERE user_id=4 AND is_current=1;\n-- INSERT 新版本 city='上海' ...\n\nSELECT * FROM users_scd2\nWHERE user_id=4\n  AND valid_from <= '2024-01-15'\n  AND valid_to   >  '2024-01-15';\n```\n\n### 查询结果\n\n点 2024-01-15 得到旧城市；当前行是上海。\n\n### 用在哪\n\n1. 地址/等级历史  2. 价格维  3. 合规审计\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 不闭链 | 多个 current | 先闭链 |\n| 用 NULL 当无限终点 | 比较别扭 | 远未来哨兵 |\n\n\n\n### 教义深讲\n\n围绕「SCD2 拉链表」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n为 Ada 模拟一次城市变更，并查她 2024-01-02 的城市。",

              "content": "### 课前\n\n- **场景**：只要「当前城市 + 上一城市」，不要完整历史。\n- **目标**：会用 SCD3：有限历史列，而不是无限拉链。\n- **先修**：SCD1 / SCD2\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nusers.city 与 previous_city。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`。\n\n### 是什么\n\n- **SCD3**：在行上保留当前值与有限个历史列。\n- **适合**：只要「前值」对比，不要任意时点时光旅行。\n- **对比**：完整审计仍选 SCD2。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）\n2. 按下述 SQL/DDL 改到你的主题域\n3. 用「查询结果」与源或上一层做闭合\n4. 对照易错表，确认没有把口径写进错误的层\n\n```sql\n-- SCD3 示意\n-- city='上海', previous_city=NULL → 变更后\n-- city='北京', previous_city='上海'\nSELECT user_id, city AS current_city, previous_city\nFROM users;\n```\n\n### 查询结果\n\n能回答「现在 vs 上一版」，不能回答任意历史日。\n\n### 用在哪\n\n1. 简单对比报表  2. 存储敏感场景  3. 与 SCD2 搭配\n\n**上下游**：与 ETL 调度/对账课、BI 指标课对照学习。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 用 SCD3 冒充审计 | 缺历史 | SCD2 |\n| 历史列无限加 | 表很宽 | 改 SCD2 |\n| 与事实点时间混用 | 对不齐 | 选对类型 |\n\n### 教义深讲\n\n围绕「SCD3」记住：可复现、可重跑、可追溯。支付口径统一 `status='paid'` + `COALESCE(amount,0)`。\n\n### 动手\n\n手机号纠错、城市变更、会员等级，分别倾向 SCD1/2/3？",

              "content": "### 课前\n\n- **场景**：事实先入，维表后到，出现大量 unknown 城市。\n- **目标**：掌握「维→事实→汇总」装载顺序与晚到维补救。\n- **先修**：调度依赖\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nusers 与 orders 同日批。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`。\n\n### 是什么\n\n- **原则**：先保证维度成员存在，再挂事实代理键。\n- **晚到维**：先占位 unknown，次日回补或重述近 N 天。\n- **汇总**：必须在明细稳定后。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）\n2. 按下述 SQL/DDL 改到你的主题域\n3. 用「查询结果」与源或上一层做闭合\n4. 对照易错表，确认没有把口径写进错误的层\n\n```sql\n-- 1) 装维\n-- INSERT dim_user ... FROM users\n-- 2) 装事实（找代理键）\nSELECT o.order_id, u.user_id, COALESCE(o.amount,0) pay_amt\nFROM orders o\nLEFT JOIN users u ON u.user_id=o.user_id\nWHERE o.status='paid';\n```\n\n### 查询结果\n\n事实行能关联到维；未知成员可计量。\n\n### 用在哪\n\n1. 日批  2. 回填  3. 质量门禁\n\n**上下游**：与 ETL 调度/对账课、BI 指标课对照学习。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 事实先写死自然键不管维 | 报表破洞 | 维优先/占位 |\n| 汇总读未完成分区 | 跳动 | 就绪标志 |\n| 忽略迟到维 | 长期 unknown | lookback 重述 |\n\n### 教义深讲\n\n围绕「装载顺序」记住：可复现、可重跑、可追溯。支付口径统一 `status='paid'` + `COALESCE(amount,0)`。\n\n### 动手\n\n维晚到 2 小时，给出两种补救策略。",

              "content": "### 课前\n\n- **场景**：DWS 上线后财务说 GMV 少了 8%。\n- **目标**：建立层间对账与基础 DQ（唯一、空值、波动）。\n- **先修**：分区 → 练习场\n- **学完标准**：能复述定义、独立写出等价实现、指出至少两个翻车点。\n\n### 样例输入\n\nDWD 明细 vs DWS 汇总。\n\n> 同源四表：`users` / `orders` / `order_items` / `order_events`（与 SQL/ETL 一致）。\n\n### 是什么\n\n- **对账**：同源不同层的指标闭合。\n- **DQ**：主键唯一、空值率、行数波动、枚举合法。\n- **门禁**：失败阻断下游 ADS。\n\n**教义锚点**：仓内每一层都要能回答「一行代表什么、口径谁负责、重跑是否安全」。\n\n### 怎么写\n\n**建议步骤**\n\n1. 先写清粒度与分区（dt）  \n2. 按下述 SQL/DDL 改到你的主题域  \n3. 用「查询结果」与源或上一层做闭合  \n4. 对照易错表，确认没有把口径写进错误的层  \n\n```sql\n-- 层间对账\nSELECT 'dwd' AS layer, SUM(COALESCE(amount,0)) AS gmv\nFROM orders WHERE status='paid'\nUNION ALL\nSELECT 'dws', SUM(gmv) FROM (\n  SELECT user_id, SUM(COALESCE(amount,0)) gmv\n  FROM orders WHERE status='paid' GROUP BY user_id\n) t;\n\n-- 唯一性\nSELECT order_id, COUNT(*) c FROM orders GROUP BY order_id HAVING COUNT(*)>1;\n\n-- 空值率\nSELECT AVG(CASE WHEN amount IS NULL THEN 1 ELSE 0 END) AS null_rate\nFROM orders WHERE status='paid';\n```\n\n### 查询结果\n\n两层 gmv 应一致；order_id 无重复；paid 空值率=1/6。\n\n### 用在哪\n\n1. 上线验收  2. 晨检  3. 事故定位\n\n**上下游**：ODS/DWD 服务可复用明细；DWS/ADS 服务指标与产品；ETL 负责按时按质送数。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 只看行数不对金额 | 漏口径 | 金额+笔数双对 |\n| 质检不阻断 | 脏数进看板 | 门禁 |\n\n\n\n### 教义深讲\n\n围绕「对账质检」记住三条落地纪律：\n\n1. **可复现**：换一个人、同一输入，能得到同一输出（含 NULL、去重、时间窗规则）。\n2. **可重跑**：同一分区 / 窗口跑两次结果不变；做不到就先别开自动重试。\n3. **可追溯**：口径争议能指到层、任务、契约版本与样例验收数。\n\n**同源样例对照（务必会）**\n\n- 支付口径：`status='paid'` + `SUM(COALESCE(amount,0))`\n- 防爆炸：`order_items` 先按 `order_id` 聚合，再关联订单头\n- 事件权威：`order_events` 按 `(order_id, event_type)` 去重取最新\n- 验收种子：users=4，orders=8，events=7，items=5\n\n**岗位分层**\n\n| 级别 | 你应该能做到 |\n|---|---|\n| 初级 | 照模板改表名，完成行数/金额闭合 |\n| 中级 | 设计增量水位、SCD/MERGE、失败可回填 |\n| 高级 | 定 SLA/契约，做血缘影响分析与可回滚发布 |\n\n### 动手\n\n为 order_items 写一条「孤儿订单行」质检 SQL。",

              "content": "### 课前\n\n- **场景**：产品要「支付金额」指标，但有人用下单额、有人用实付。\n- **目标**：能定义原子指标：业务过程 + 度量 + 聚合。\n- **先修**：BI 定位。\n\n### 样例输入\n\n与 SQL/数仓同源：`users` / `orders`（支付 status='paid'）/ `order_items` / `order_events`。\n\n### 是什么\n\n- **原子指标**：不可再拆的业务度量（如支付金额）。\n- **三要素**：业务过程（支付成功）、度量字段（amount）、聚合（SUM）。\n- **字典**：名称、口径、负责人、刷新。\n\n### 怎么写\n\n```sql\nSELECT SUM(COALESCE(amount,0)) AS pay_amt\nFROM orders\nWHERE status = 'paid'\n  AND created_at >= '{{start}}'\n  AND created_at <  '{{end}}';\n```\n\n### 查询结果\n\n得到时间窗内支付 GMV；NULL 金额按 0 或剔除需写清。\n\n### 用在哪\n\n1. **GMV/支付额**。\n2. **订单量 COUNT(*)**。\n3. **活跃用户数 COUNT DISTINCT**。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 聚合方式不写 | 有人 AVG 有人 SUM | 字典强制聚合 |\n| 含退款争议 | 财务对不上 | 明示含不含退款 |\n| 时区含糊 | 日界错位 | 统一业务时区 |\n\n### 动手\n\n为「支付订单数」写字典五元组：过程/字段/聚合/时间/Owner。",
              "children": []

              "level": "??",
              "content": "### 课前\n\n- **场景**：只要「近 7 日支付转化率」，不要每次手写 SQL。\n- **目标**：会用原子 + 时间/修饰/运算得到派生指标。\n- **先修**：原子指标。\n\n### 样例输入\n\n与 SQL/数仓同源：`users` / `orders`（支付 status='paid'）/ `order_items` / `order_events`。 可用日汇总表近似。\n\n### 是什么\n\n- **派生指标**：原子 + 周期/修饰/四则或比率。\n- **例**：支付 UV / 访问 UV = 支付转化率。\n- **原则**：分母定义与分子同窗、同修饰。\n\n### 怎么写\n\n```sql\nSELECT\n  pay_uv_7d * 1.0 / NULLIF(visit_uv_7d, 0) AS pay_cvr_7d\nFROM dws.traffic_pay_1d\nWHERE dt = '{{ds}}';\n```\n\n### 查询结果\n\n得到 7 日转化率；分母 0 时得 NULL 而非炸墙。\n\n### 用在哪\n\n1. **转化率**。\n2. **客单价 = GMV / 支付用户数**。\n3. **留存率**。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 分母为 0 未处理 | Infinity/报错 | NULLIF |\n| 分子分母修饰不一致 | 虚高/虚低 | 同窗同过滤 |\n| 同名异义 | 跨团队吵数 | 修饰进名称或字典 |\n\n### 动手\n\n写出「上海用户近 7 日客单价」的派生拆解（原子+修饰）。",

              "id": "bi-composite",
              "title": "复合指标",
              "level": "???",
              "content": "### 课前\n\n- **场景**：运营要「渠道贡献度」和「健康分」，由多个指标加权。\n- **目标**：理解复合指标的公式治理与影响面。\n- **先修**：派生指标。\n\n### 样例输入\n\n渠道日 GMV 汇总表（可由 orders 按渠道聚合；样例可先按 city 代替 channel）。\n\n### 是什么\n\n- **复合指标**：多个原子/派生按业务公式组合。\n- **风险**：公式一变，全司看板跟着变。\n- **治理**：版本号、公告、回滚。\n\n### 怎么写\n\n```sql\nSELECT city AS channel,\n       gmv * 1.0 / NULLIF(SUM(gmv) OVER (), 0) AS gmv_share\nFROM (\n  SELECT COALESCE(u.city,'未知') AS city,\n         SUM(COALESCE(o.amount,0)) AS gmv\n  FROM orders o JOIN users u ON u.user_id=o.user_id\n  WHERE o.status='paid'\n  GROUP BY 1\n) t;\n```\n\n### 查询结果\n\n各城市 GMV 占比之和为 1（忽略舍入）。\n\n### 用在哪\n\n1. **贡献拆解**。\n2. **综合健康分**。\n3. **加权评分看板**。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 公式只写在前端 | 多端不一致 | 下沉指标平台/语义层 |\n| 改权重不公告 | 环比突变被误读 | 版本+公告 |\n| 不可加指标乱加总 | 数学无意义 | 先归一再复合 |\n\n### 动手\n\n设计一个「支付健康分」：列出 2～3 个输入指标与权重。",

              "content": "### 课前\n\n- **场景**：同一「支付金额」要切 App/近7日/新客。\n- **目标**：把时间与业务修饰标准化，避免指标名爆炸却不可管。\n- **先修**：原子/派生。\n\n### 样例输入\n\n与 SQL/数仓同源：`users` / `orders`（支付 status='paid'）/ `order_items` / `order_events`。\n\n### 是什么\n\n- **修饰词**：时间（7d/mtd）、主体（新客）、终端（App）、状态（paid）。\n- **价值**：原子少、组合多、可治理。\n- **命名**：`app_paid_amt_7d` 一类可读约定。\n\n### 怎么写\n\n```text\n原子：支付金额\n+ 时间：近7日\n+ 修饰：status=paid, platform=app\n→ 指标：app_paid_amt_7d\n```\n\n### 查询结果\n\n修饰白名单内可配置；超白名单需立项。\n\n### 用在哪\n\n1. **指标平台配置**。\n2. **语义层参数/筛选器**。\n3. **报表命名规范**。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 修饰自由输入 | 同义一千名 | 枚举白名单 |\n| 含不含当天不清 | 对不齐 | 字典写闭区间规则 |\n| 修饰顺序乱 | 搜不到 | 命名规范文档 |\n\n### 动手\n\n给「支付金额」列出至少 4 个合法修饰组合名称。",

              "content": "### 课前\n\n- **场景**：从图上的「上海」点进去看区县或用户。\n- **目标**：分清下钻（Drill down）与上卷（Roll up）。\n- **先修**：切片切块。\n\n### 样例输入\n\n城市→用户 的层次（示意）。\n\n### 是什么\n\n- **下钻**：从高层次到细节（月→日、城→用户）。\n- **上卷**：反之汇总。\n- **要求**：层次在模型中预定义或可关联。\n\n### 怎么写\n\n```sql\n-- 上卷：按城市\nSELECT u.city, SUM(COALESCE(o.amount,0)) gmv\nFROM orders o JOIN users u ON u.user_id=o.user_id\nWHERE o.status='paid' GROUP BY 1;\n-- 下钻：某城到用户\nSELECT u.user_name, SUM(COALESCE(o.amount,0)) gmv\nFROM orders o JOIN users u ON u.user_id=o.user_id\nWHERE o.status='paid' AND u.city='上海' GROUP BY 1;\n```\n\n### 查询结果\n\n先城后人，层次清晰。\n\n### 用在哪\n\n1. **交互看板**。\n2. **异常定位**。\n3. **管理层→执行层叙事**。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 无层次硬跳明细 | 权限/性能爆 | 分层数据集 |\n| 下钻丢过滤上下文 | 数对不上 | 过滤器继承 |\n| 明细行过大 | 浏览器卡死 | 明细上限+导出异步 |\n\n### 动手\n\n设计 city → user_name 的下钻路径与权限点。",

              "title": "旋转透视",
              "level": "??",
              "content": "### 课前\n\n- **场景**：要把「用户×状态」的订单数做成透视表。\n- **目标**：理解透视（Pivot）与交叉表在 BI 中的用法。\n- **先修**：维度度量。\n\n### 样例输入\n\n与 SQL/数仓同源：`users` / `orders`（支付 status='paid'）/ `order_items` / `order_events`。\n\n### 是什么\n\n- **透视**：行维×列维交叉，单元格放聚合度量。\n- **注意**：列维基数过高会很宽。\n\n### 怎么写\n\n```sql\nSELECT user_id,\n       SUM(CASE WHEN status='paid' THEN 1 ELSE 0 END) AS paid_cnt,\n       SUM(CASE WHEN status='created' THEN 1 ELSE 0 END) AS created_cnt,\n       SUM(CASE WHEN status='cancelled' THEN 1 ELSE 0 END) AS cancelled_cnt\nFROM orders\nGROUP BY user_id\nORDER BY user_id;\n```\n\n### 查询结果\n\n每用户一行，状态在列上。\n\n### 用在哪\n\n1. **交叉报表**。\n2. **Excel 透视替代**。\n3. **矩阵热力**。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 列维基数上千 | 表无法阅读 | 改成筛选+排行 |\n| 度量放错 | 空白太多 | 明确聚合 |\n| 与明细导出混淆 | 期望看行明细 | 另提供明细视图 |\n\n### 动手\n\n用样例做出 user_id × status 的计数透视。",

              "content": "### 课前\n\n- **场景**：要在图上加「是否高价值订单」。\n- **目标**：会写计算字段并控制聚合级别。\n- **先修**：度量计算。\n\n### 样例输入\n\n与 SQL/数仓同源：`users` / `orders`（支付 status='paid'）/ `order_items` / `order_events`。\n\n### 是什么\n\n- **计算字段**：工具内表达式（IF、日期差、字符串）。\n- **纪律**：能进模型的尽量进模型。\n\n### 怎么写\n\n```text\n-- Tableau/同类伪代码\nIF [amount] >= 100 THEN '高价值' ELSE '普通' END\n-- SQL 等价\nSELECT *, CASE WHEN amount>=100 THEN '高价值' ELSE '普通' END AS tier FROM orders;\n```\n\n### 查询结果\n\n可按 tier 着色/筛选。\n\n### 用在哪\n\n1. **快速迭代**。\n2. **分层标签**。\n3. **原型**。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 复杂逻辑堆前端 | 难测试 | 下沉 SQL/模型 |\n| 行级与聚合级混淆 | 结果怪 | 明确 FIXED/INCLUDE 或先聚合 |\n| 复制粘贴多份 | 改一漏三 | 单一计算源 |\n\n### 动手\n\n写一个「新客」计算字段定义（依赖注册日与首单日）。",

              "content": "### 课前\n\n- **场景**：要算「每用户平均订单额，再对城市求平均」。\n- **目标**：理解粒度（LOD）与嵌套聚合。\n- **先修**：计算字段。\n\n### 样例输入\n\n与 SQL/数仓同源：`users` / `orders`（支付 status='paid'）/ `order_items` / `order_events`。\n\n### 是什么\n\n- **粒度**：聚合发生在哪一层。\n- **LOD**：先按用户聚合，再按城市聚合。\n\n### 怎么写\n\n```sql\n-- 每用户 GMV\nSELECT user_id, SUM(COALESCE(amount,0)) AS user_gmv\nFROM orders WHERE status='paid' GROUP BY 1;\n-- 再对城市平均（需维）\nSELECT u.city, AVG(t.user_gmv) AS avg_user_gmv\nFROM (...) t JOIN users u ON ... GROUP BY 1;\n```\n\n### 查询结果\n\n避免直接 AVG(amount) 把多单用户与单用户一视同仁时的误读（按问题选用）。\n\n### 用在哪\n\n1. **客单价类指标**。\n2. **嵌套均值**。\n3. **队列人均**。\n\n### 易错对照\n\n| 错法 | 现象 | 纠正 |\n|---|---|---|\n| 一步 AVG 到底 | 业务含义错 | 画清粒度两步 |\n| LOD 与筛选冲突 | 数飘 | 规定计算上下文 |\n| 性能差 | 超时 | 预聚合表 |\n\n### 动手\n\n用文字写出「城市平均客单价」的两步粒度。",

        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const id = el.getAttribute("data-id");
          const node = findSqlKgNode(id);
          if (!node) return;
          const kids = node.children || [];
          if (kids.length) {
            if (sqlKgState.openIds.has(id)) sqlKgState.openIds.delete(id);
            else sqlKgState.openIds.add(id);
            sqlKgState.activeId = id;
            paintSqlKg();
            // 非叶子：若有 content，也可在抽屉预览导读
            if (node.content) openSqlKgDrawer(node);
            else closeSqlKgDrawer();
          } else {
            sqlKgState.activeId = id;
            sqlKgState.openIds.add(id);
            paintSqlKg();
            openSqlKgDrawer(node);
          }
        });
      });

    function placeNodes() {
      const m = layoutMetrics();
      if (HOME_HERO_ONLY && !(kgDrill && kgDrill.active)) {
        const cx = (typeof width === "function" ? width() : m.w) / 2;
        const cy = (typeof height === "function" ? height() : m.h) / 2;
        const hubs = (typeof HOME_HERO_HUBS !== "undefined" && HOME_HERO_HUBS.length)
          ? HOME_HERO_HUBS : [HOME_HUB_ID];
        const R = Math.min(
          (typeof width === "function" ? width() : m.w),
          (typeof height === "function" ? height() : m.h)
        ) * 0.26;
        const hubSet = new Set(hubs);
        nodes.forEach(n => {
          const i = hubs.indexOf(n.id);
          if (i >= 0) {
            const ang = -Math.PI / 2 + (i * 2 * Math.PI / hubs.length);
            n.x = n.fx = cx + (hubs.length === 1 ? 0 : R * Math.cos(ang));
            n.y = n.fy = cy + (hubs.length === 1 ? 0 : R * Math.sin(ang));
          } else {
            n.x = n.fx = -4000;
            n.y = n.fy = -4000;
          }
        });
        return m;
      }
      // 焦点模式：中心锁定 hub，其它节点移出视野（避免流水线坐标把一级卫星挤没）
      if (kgDrill && kgDrill.active && kgDrill.hubId) {

          y = m.padTop + m.mainH * 0.48;

          y = m.padTop + m.mainH * (0.22 + t * 0.56);
        }
        n.x = x; n.y = y; n.fx = x; n.fy = y;
      });
      return m;

    function linkPath(d) {
      const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
      const dx = tx - sx, dy = ty - sy;
      const dist = Math.hypot(dx, dy) || 1;
      const pad = 32;
      const x2 = tx - (dx / dist) * pad, y2 = ty - (dy / dist) * pad;
      const mx = (sx + x2) / 2, my = (sy + y2) / 2;
      const nx = -dy / dist, ny = dx / dist;
      const bend = Math.min(36, dist * 0.12) * (d.trunk ? 0.35 : 0.9);
      return `M${sx},${sy}Q${mx + nx * bend},${my + ny * bend} ${x2},${y2}`;
    }

        function currentKgTree() {

        function findKgNode(id, node) {
          const root = node || currentKgTree();
          if (!root) return null;
          if (root.id === id) return root;
          for (const c of (root.children || [])) {
            const hit = findKgNode(id, c);
            if (hit) return hit;
          }
          return null;
        }
    
        function kgNodeKids(n) {
          return (n && n.children) ? n.children : [];
        }
    
        function isKgLeaf(n) {
          return !kgNodeKids(n).length;
        }
    
        /** 倒数第二层：有子节点且子节点全部为叶，或显式 lessonParent */
        function isLessonParent(n) {
          if (!n) return false;
          const kids = kgNodeKids(n);
          if (!kids.length) return false;
          if (n.lessonParent === true) return true;
          return kids.every(isKgLeaf);
        }
    
        function levelRank(level) {
          if (level === "?" || level === "1" || level === "junior") return 1;
          if (level === "???" || level === "3" || level === "senior") return 3;
          return 2; // ?? / mid / default
        }
    
        function depthAllows(level) {
          const need = levelRank(level);
          if (depthLevel === "junior") return need <= 1;
          if (depthLevel === "mid") return need <= 2;
          return true;
        }
    
        function filterKgChildren(kids) {
          return (kids || []).filter(c => depthAllows(c.level || "??"));
        }
    
        function kgPathTitles(id) {
          const root = currentKgTree();
          if (!root || !id) return [];
          const trail = [];
          function dfs(node) {
            trail.push(node.title);
            if (node.id === id) return true;
            for (const c of (node.children || [])) {
              if (dfs(c)) return true;
            }
            trail.pop();
            return false;
          }
          return dfs(root) ? trail.slice() : [];
        }

        function wireKgFocusSearch() {

            const tree = currentKgTree();
            if (!tree || !q) { drop.classList.remove("open"); drop.innerHTML = ""; return; }
            const all = [];
            collectSearchNodes(tree, [], all);
            const qq = q.trim().toLowerCase();
            const terms = kgSearchTerms(qq);
            const hits = all.filter(x => {
              const blob = (x.title + " " + x.path).toLowerCase();
              return terms.some(t => blob.includes(t));
            }).slice(0, 12);
            if (!hits.length) {
              drop.innerHTML = '<button type="button" disabled>无匹配</button>';
              drop.classList.add("open");
              return;
            }
            const hilite = (s) => {
              const i = s.toLowerCase().indexOf(qq);
              if (i < 0) return escapeHtml(s);
              return escapeHtml(s.slice(0, i)) + "<mark>" + escapeHtml(s.slice(i, i + qq.length)) + "</mark>" + escapeHtml(s.slice(i + qq.length));
            };
            drop.innerHTML = hits.map(h =>
              `<button type="button" data-sid="${escapeHtml(h.id)}"><div>${hilite(h.title)}</div><div class="meta">${escapeHtml(h.path)}</div></button>`
            ).join("");
            drop.classList.add("open");

                const id = btn.getAttribute("data-sid");

                drop.classList.remove("open");
                input.value = n.title;
                // 展开到该节点：找父链
                pushKgFocusHistory();
                const pathIds = [];
                (function dfs(node, trail) {
                  const t = trail.concat(node);
                  if (node.id === id) { pathIds.push(...t.map(x => x.id)); return true; }
                  for (const c of (node.children || [])) if (dfs(c, t)) return true;
                  return false;
                })(currentKgTree(), []);
                // pathIds[0]=root, [1]=L2 domain, [2]=L3, [3]=leaf
                if (pathIds.length >= 2) kgDrill.expandedL2 = pathIds[1];
                if (pathIds.length >= 3) kgDrill.expandedL3 = pathIds[2];

                redrawKgDrill();
                openKgSidePanel(n, isLessonParent(n) ? "chapter" : (kgNodeKids(n).length ? "chapter" : "lesson"));
                updateKgDrillHint();
              });
            });
          };

          input.addEventListener("focus", () => { if (input.value) renderDrop(input.value); });
          document.addEventListener("click", () => drop.classList.remove("open"));
          wireKgHotkeys();
        }
