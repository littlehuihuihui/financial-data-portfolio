<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/platform-shell.css?v=3.52">
  <link rel="stylesheet" href="../css/data-faq.css?v=2.2">
</head>
<body class="page-data-faq">
  <header class="top-nav">
    <div class="nav-inner">
      <div class="brand-title">DATA NEXUS</div>
      <nav class="nav-tabs" aria-label="页面导航">
        <a href="../index.html" class="nav-tab">平台首页</a>
        <a href="data-faq.html" class="nav-tab active">数据分析答疑</a>
        <a href="../industries/retail/pages/architecture.html" class="nav-tab">零售架构</a>
        <a href="../industries/internet/pages/architecture.html" class="nav-tab">互联网架构</a>
        <a href="../industries/manufacturing/pages/architecture.html" class="nav-tab">制造架构</a>
      </nav>
    </div>
  </header>
  <main class="dfaq-page-wrap">
    <h1 class="dfaq-page-title">数据分析答疑</h1>
    <p class="dfaq-page-sub">
      常见问题合集：作品集如何做成、数仓五层、落地技术栈（含较完整的 MySQL 讲解）、分析看板与面试答法。
      选择行业后，部分题目底部会附带该行业的库名、端口与表例。
    </p>
    <div class="dfaq-toolbar">
      <label class="dfaq-industry-pick">
        预览行业例子
        <select id="dfaq-industry">
          <option value="">不限定（平台总览）</option>
          <option value="retail">零售财务</option>
          <option value="internet">互联网 OTT</option>
          <option value="manufacturing">制造业</option>
        </select>
      </label>
      <p class="dfaq-toolbar-hint">MySQL 相关建议按顺序看：角色 → 字段约定 → JOIN 放大 → 查询骨架 → 视图 → 窗口函数 → EXPLAIN。</p>
    </div>
    <div id="data-faq-root"></div>
  </main>
  <script src="../js/data-faq-data.js?v=2.3"></script>
  <script src="../js/data-faq.js?v=2.3"></script>
  <script>
    (function () {
      var root = document.getElementById("data-faq-root");
      var sel = document.getElementById("dfaq-industry");
      var api = null;
      function remount() {
        api = window.DataFaq.mount(root, { industry: sel.value || "" });
      }
      sel.addEventListener("change", remount);
      remount();
    })();
  </script>
