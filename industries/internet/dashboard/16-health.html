<section class="dashboard-page" data-dashboard="health">
  <h2 class="dashboard-page-title">业务健康度仪表盘</h2>
  <p class="dashboard-page-desc">关键指标一页纸 · 红黄绿灯 · 基线对比</p>
  <div class="kpi-grid" id="db-kpi"></div>
  <div class="chart-row two-col">
    <div class="chart-box"><h3>各维度健康分</h3><div id="db-chart-health-score" class="chart"></div></div>
    <div class="chart-box"><h3>指标状态分布</h3><div id="db-chart-health-status" class="chart"></div></div>
  </div>
  <div class="chart-box">
    <div class="table-toolbar"><h3>健康指标明细</h3>
      <button type="button" class="btn-dash btn-sm" data-export-table="db-table-health" data-export-name="健康指标.csv">导出 CSV</button></div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>指标组</th><th>指标</th><th class="num">当前值</th><th>单位</th><th class="num">基线</th><th>状态</th></tr></thead><tbody id="db-table-health"></tbody></table></div>
  </div>
  <div class="chart-box">
    <div class="table-toolbar"><h3>维度汇总</h3>
      <button type="button" class="btn-dash btn-sm" data-export-table="db-table-hsum" data-export-name="健康度汇总.csv">导出 CSV</button></div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>指标组</th><th class="num">指标数</th><th class="num">正常</th><th class="num">警告</th><th class="num">告警</th><th class="num">健康分%</th></tr></thead><tbody id="db-table-hsum"></tbody></table></div>
  </div>
</section>
