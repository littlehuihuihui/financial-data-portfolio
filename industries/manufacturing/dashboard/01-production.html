<section class="dashboard-page" data-dashboard="production">
  <h2 class="dashboard-page-title">生产总览</h2>
  <p class="dashboard-page-desc">产量 · 产能利用率 · 产线明细（含OTD/计划达成，支持工厂筛选）· manufacturing_analytics</p>
  <div id="db-kpi" class="kpi-grid"></div>
  <div class="chart-box"><h3>产量 / 产能利用率趋势</h3><div id="db-chart-output-trend" class="chart"></div></div>
  <div class="chart-box"><h3>产线产量份额</h3><div id="db-chart-line-share" class="chart"></div></div>
  <div class="chart-box">
    <div class="table-toolbar">
      <h3>产线明细</h3>
      <button type="button" class="btn-dash btn-sm" data-export-table="db-table-line" data-export-name="产线明细.csv">导出 CSV</button>
    </div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>产线</th><th>工厂</th><th class="num">产量</th><th class="num">产能利用率%</th><th class="num">准时交付率%</th><th class="num">计划达成率%</th></tr></thead><tbody id="db-table-line"></tbody></table></div>
  </div>
</section>
