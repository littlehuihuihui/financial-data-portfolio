<section class="dashboard-page" data-dashboard="delivery">
  <h2 class="dashboard-page-title">交付分析（OTD）</h2>
  <p class="dashboard-page-desc">准时交付率 · 计划达成率 · 逾期工单清单 · 在制品WIP · 数据源：dwd_production_wide / fact_process_operation</p>
  <div id="db-kpi" class="kpi-grid"></div>
  <div class="chart-box"><h3>准时交付率 / 计划达成率趋势</h3><div id="db-chart-otd-trend" class="chart"></div></div>
  <div class="chart-box"><h3>在制品（WIP）工序分布</h3><div id="db-chart-wip" class="chart"></div></div>
  <div class="chart-box">
    <div class="table-toolbar">
      <h3>逾期工单清单</h3>
      <button type="button" class="btn-dash btn-sm" data-export-table="db-table-late" data-export-name="逾期工单.csv">导出 CSV</button>
    </div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>工单号</th><th>产品</th><th>产线</th><th>交付日期</th><th class="num">逾期天</th><th class="num">计划量</th><th class="num">实际量</th><th class="num">缺口</th><th>预警</th></tr></thead><tbody id="db-table-late"></tbody></table></div>
  </div>
</section>
