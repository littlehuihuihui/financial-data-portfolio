<section class="dashboard-page" data-dashboard="scrap-rework">

  <div id="db-kpi" class="kpi-grid"></div>
  <div class="chart-row">
    <div class="chart-box"><h3>产线报废 / 返工</h3><div id="db-chart-scrap-line" class="chart"></div></div>

  </div>
  <div class="chart-box">

      <h3>产线报废明细</h3>

    </div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>产线</th><th class="num">报废数</th><th class="num">返工数</th><th class="num">报废率%</th><th>预警</th></tr></thead><tbody id="db-table-scrap-line"></tbody></table></div>
  </div>
</section>
