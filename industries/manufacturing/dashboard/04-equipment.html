<section class="dashboard-page" data-dashboard="equipment">
  <h2 class="dashboard-page-title">设备 OEE</h2>
  <p class="dashboard-page-desc">设备综合效率 · 停机原因分布 · 设备明细（含产线/工厂）</p>
  <div id="db-kpi" class="kpi-grid"></div>
  <div class="chart-box"><h3>设备 OEE 排名</h3><div id="db-chart-oee-bar" class="chart"></div></div>
  <div class="chart-box"><h3>停机原因构成</h3><div id="db-chart-downtime" class="chart"></div></div>
  <div class="chart-box">
    <div class="table-toolbar">
      <h3>设备明细（OEE 升序，优先关注低效设备）</h3>
      <button type="button" class="btn-dash btn-sm" data-export-table="db-table-equipment" data-export-name="设备明细.csv">导出 CSV</button>
    </div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>设备</th><th>产线</th><th>工厂</th><th class="num">OEE%</th><th class="num">时间开动率%</th><th class="num">停机时长</th><th class="num">故障次数</th><th>预警</th></tr></thead><tbody id="db-table-equipment"></tbody></table></div>
  </div>
</section>
