<!DOCTYPE html>
<html lang="zh-CN" data-industry="retail">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="零售财务 · 全屏数据字典（口径 / 看板引用）">
  <title>零售财务 · 数据字典</title>
  <link rel="stylesheet" href="../../../css/design-tokens.css">
  <link rel="stylesheet" href="../../../css/platform-shell.css?v=3.28">
  <link rel="stylesheet" href="../css/industry-overrides.css">
  <link rel="stylesheet" href="../css/platform-features.css?v=3.28">
  <link rel="stylesheet" href="../../../css/data-dictionary.css?v=3.29">
  <style>
    .dict-page-main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 48px; }
    .dict-page-header { margin-bottom: 16px; }
    .dict-page-header h1 { margin: 0 0 6px; font-size: 22px; }
    .dict-page-header p { margin: 0; color: var(--text-secondary, #8892a4); font-size: 13px; }
    #data-dictionary-root { min-height: 70vh; }
  </style>
</head>
<body class="page-dictionary" data-industry="retail">
  <header class="top-nav">
    <div class="nav-inner nav-inner-with-search">
      <div class="brand-title">零售财务</div>
      <div id="global-search-slot"></div>
      <nav class="nav-tabs" aria-label="页面导航">
        <a href="../retail_dashboard.html" class="nav-tab">数据展示</a>
        <a href="anomaly.html" class="nav-tab">分析方法论</a>
        <a href="architecture.html" class="nav-tab">数仓架构</a>
        <a href="platform-graph.html" class="nav-tab">知识图谱</a>
        <a href="../../../index.html" class="nav-tab nav-home">返回平台</a>
      </nav>
    </div>
  </header>

  <main class="dict-page-main" id="data-dictionary-section">
    <div class="dict-page-header">
      <h1>数据字典 · 全屏</h1>
      <p>字段口径（业务 / 技术 / 排除规则）与表级看板引用。也可从 <a href="architecture.html#data-dictionary-section">架构页嵌入版</a> 进入。</p>
    </div>
    <div id="data-dictionary-root" class="data-dictionary"></div>
  </main>

  <script src="../js/data-dictionary-data.js"></script>
  <script src="../js/dashboard-config.js"></script>
  <script src="../js/metric-caliber-data.js"></script>
  <script src="../js/search-index-data.js"></script>
  <script src="../../../js/data-dictionary-core.js?v=3.29"></script>
  <script src="../js/data-dictionary.js"></script>
  <script src="../../../js/global-search.js?v=3.28"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.GlobalSearch?.mount?.("global-search-slot");
      if (!window.DataDictionaryUI?.render) return;
      const dictInstance = window.DataDictionaryUI.render("data-dictionary-root", {
        showAdsApplicationMap: false,
                showOverview: false
      });
      window.DataDictionaryUI.instance = dictInstance;
      window.DataDictionaryUI.selectTable = (name) => dictInstance.selectTableByName(name);
      window.DataDictionaryUI.selectField = (table, field) => dictInstance.selectFieldByName(table, field);
      window.DataDictionaryUI.highlightField = (key) => dictInstance.highlightField(key);
      window.DataDictionaryUI.navigateTo = (table, field) => dictInstance.navigateTo(table, field);
      window.GlobalSearch?.consumePendingNav?.();
    });
  </script>
</body>
</html>
