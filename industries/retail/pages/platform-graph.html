<body class="page-platform-graph" data-industry="retail">
  <header class="top-nav">
    <div class="nav-inner nav-inner-with-search">
      <div class="brand-title">零售财务</div>
      <div id="global-search-slot"></div>
      <nav class="nav-tabs" aria-label="页面导航">
        <a href="../retail_dashboard.html" class="nav-tab">数据展示</a>
        <a href="anomaly.html" class="nav-tab">分析方法论</a>
        <a href="architecture.html" class="nav-tab">数仓架构</a>
        <a href="platform-graph.html" class="nav-tab active">知识图谱</a>
        <a href="../../../index.html" class="nav-tab nav-home">返回平台</a>
      </nav>
    </div>
  </header>
  <div id="pkgRoot"><p id="pkgBootHint" style="padding:24px;color:#94a3b8;font-size:14px">正在加载知识图谱…</p></div>
  <script src="../js/platform-kg-data.js?v=3.53" defer></script>
  <script src="../../../js/platform-knowledge-graph.js?v=3.53" defer></script>
  <script src="../../../js/global-search.js?v=3.53" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.GlobalSearch?.mount?.("global-search-slot");
      // 兜底：若 800ms 后仍无落地页，强制再 init 一次
      setTimeout(() => {
        const root = document.getElementById("pkgRoot");
        if (!root) return;
        if (root.querySelector(".kg2-landing, .kg2-page")) return;
        if (window.PLATFORM_KG_DATA && typeof window.initPlatformKnowledgeGraph === "function") {
          try {
            window.initPlatformKnowledgeGraph({ root: "#pkgRoot", embed: false });
          } catch (e) {
            root.innerHTML = '<div style="padding:32px;color:#f87171">知识图谱失败：' + (e && e.message ? e.message : e) + "</div>";
          }
        }
      }, 800);
    });
  </script>
</body>
</html>
