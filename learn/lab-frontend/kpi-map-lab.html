<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KPI 映射靶场 · Data Nexus</title>
  <link rel="stylesheet" href="../../css/design-tokens.css" />
  <link rel="stylesheet" href="../../css/learn.css?v=1.5" />
  <style>
    .flab { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    @media (max-width: 800px) { .flab { grid-template-columns: 1fr; } }
    .flab textarea, .flab pre {
      width: 100%; min-height: 220px; font-family: var(--font-mono, Consolas, monospace); font-size: 12px;
      background: #0a1020; color: #e2e8f0; border: 1px solid rgba(34,211,238,.25); border-radius: 10px; padding: 10px;
      box-sizing: border-box;
    }
    .flab-out { margin-top: 1rem; padding: 12px; border-radius: 10px; border: 1px solid rgba(52,211,153,.35); white-space: pre-wrap; }
  </style>
</head>
<body class="page-learn">
  <div class="learn-scene" aria-hidden="true"><div class="learn-scene__glow"></div></div>
  <main class="learn-wrap">
    <header class="learn-hero">
      <p class="learn-eyebrow">FRONT LAB</p>
      <h1>KPI 字段映射靶场</h1>
      <p class="learn-sub">对齐 loaders 思路：从 API JSON 取字段。勿改生产 loaders.js。</p>
      <p><a class="learn-back" href="../../pages/learn-lesson.html?id=FS6">← 返回 FS6 课文</a></p>
    </header>
    <div class="learn-article">
      <p>左侧编辑 mapping（点号路径，数组用数字下标）。需要算出：今日 DAU、STB DAU、点播活跃。</p>
      <div class="flab">
        <div>
          <h3>mapping.json</h3>
          <textarea id="map">{
  "today_dau": "REPLACE_ME",
  "stb_dau": "REPLACE_ME",
  "vod_active": "REPLACE_ME"
}</textarea>
        </div>
        <div>
          <h3>模拟 API（只读）</h3>
          <pre id="payload"></pre>
        </div>
      </div>
      <p style="margin-top:1rem">
        <button type="button" class="learn-btn learn-btn-primary" id="btn">校验</button>
      </p>
      <div class="flab-out" id="out">尚未校验</div>
    </div>
  </main>
  <script>
    const API = {
      dau_trend: [
        { snapshot_date: "2026-07-14", dau: 2100, dau_stb: 1400, dau_speaker: 700 },
        { snapshot_date: "2026-07-15", dau: 2300, dau_stb: 1500, dau_speaker: 800 }
      ],
      compose: { vod_active: 1200, live_active: 400, only_launcher: 700 }
    };
    const EXPECT = { today_dau: 2300, stb_dau: 1500, vod_active: 1200 };
    const HINT = {
      today_dau: "dau_trend.1.dau",
      stb_dau: "dau_trend.1.dau_stb",
      vod_active: "compose.vod_active"
    };
    document.getElementById("payload").textContent = JSON.stringify(API, null, 2);

    function getPath(obj, path) {
      return String(path || "").split(".").reduce((a, k) => (a == null ? a : a[k]), obj);
    }

    document.getElementById("btn").onclick = function () {
      var map, lines = [], ok = true, k, got, pass;
      try { map = JSON.parse(document.getElementById("map").value); }
      catch (e) {
        document.getElementById("out").textContent = "JSON 解析失败: " + e.message;
        return;
      }
      for (k in EXPECT) {
        if (!Object.prototype.hasOwnProperty.call(EXPECT, k)) continue;
        got = getPath(API, map[k]);
        pass = got === EXPECT[k];
        if (!pass) ok = false;
        lines.push((pass ? "PASS" : "FAIL") + " " + k + " got=" + got + " expect=" + EXPECT[k] + (pass ? "" : " hint=" + HINT[k]));
      }
      if (ok) {
        lines.push("");
        lines.push("FRONT_TOKEN=dnexus-lab-front-v1-PASS");
        try {
          var labs = JSON.parse(localStorage.getItem("dnexus-learn-labs-v1") || "{}");
          labs.front = { at: Date.now() };
          localStorage.setItem("dnexus-learn-labs-v1", JSON.stringify(labs));
        } catch (e2) {}
      }
      document.getElementById("out").textContent = lines.join("\n");
    };
  </script>
</body>
</html>
